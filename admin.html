<!DOCTYPE html>
<html lang="zh-TW">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="format-detection"
    content="telephone=no"
  >

  <title>狐狸🦊 管理員後台</title>


  <!-- 手寫字體 -->

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=ChenYuluoyan&display=swap"
    rel="stylesheet"
  >


  <style>

    /* ========================================
       基本設定
    ======================================== */

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }


    html {
      min-height: 100%;
    }


    body {
      min-height: 100vh;

      padding: 30px 16px 50px;

      background: #faf8ff;

      color: #4f4660;

      font-family:
        "ChenYuluoyan",
        "HanziPen TC",
        "Hannotate TC",
        "Kaiti TC",
        cursive;
    }


    button,
    input,
    select,
    textarea {
      font: inherit;
    }


    button {
      cursor: pointer;
    }


    .hidden {
      display: none !important;
    }


    /* ========================================
       整體寬度
    ======================================== */

    .container {
      width: 100%;
      max-width: 780px;

      margin: 0 auto;
    }


    /* ========================================
       標題
    ======================================== */

    .main-title {
      margin-bottom: 8px;

      color: #6b46c1;

      font-size: 30px;
      font-weight: 600;

      text-align: center;
    }


    .subtitle {
      margin-bottom: 28px;

      color: #978aa6;

      font-size: 15px;

      text-align: center;
    }


    /* ========================================
       卡片
    ======================================== */

    .card {
      margin-bottom: 16px;

      padding: 20px;

      background: #ffffff;

      border:
        1px solid #eee6ff;

      border-radius: 22px;

      box-shadow:
        0 6px 18px
        rgba(116, 82, 165, 0.08);
    }


    /* ========================================
       登入頁
    ======================================== */

    .login-wrap {
      width: 100%;
      max-width: 420px;

      margin: 70px auto 0;
    }


    .login-card {
      padding: 28px 22px;
    }


    .login-icon {
      margin-bottom: 10px;

      font-size: 42px;

      text-align: center;
    }


    .login-title {
      margin-bottom: 22px;

      color: #6b46c1;

      font-size: 24px;
      font-weight: 600;

      text-align: center;
    }


    .login-label {
      display: block;

      margin-bottom: 8px;

      color: #6b568d;

      font-size: 16px;
      font-weight: 600;
    }


    .password-input {
      width: 100%;

      padding: 12px 14px;

      background: #faf8ff;

      color: #4f4660;

      border:
        1.5px solid #d9c8ff;

      border-radius: 14px;

      outline: none;
    }


    .password-input:focus {
      border-color: #a98be6;

      box-shadow:
        0 0 0 3px
        rgba(159, 122, 234, 0.12);
    }


    .login-button {
      width: 100%;

      margin-top: 16px;

      padding: 11px 18px;

      background: #d8c8f7;

      color: #533494;

      border: none;

      border-radius: 999px;

      font-weight: 600;
    }


    .login-button:active {
      transform: scale(0.98);
    }


    .login-button:disabled {
      opacity: 0.55;
      cursor: default;
    }


    .login-message {
      min-height: 24px;

      margin-top: 13px;

      color: #b34545;

      text-align: center;
    }


    /* ========================================
       後台上方
    ======================================== */

    .admin-header {
      display: flex;

      align-items: center;
      justify-content: space-between;

      gap: 12px;

      margin-bottom: 20px;
    }


    .admin-header-title {
      color: #6b46c1;

      font-size: 27px;
      font-weight: 600;
    }


    .logout-button {
      flex-shrink: 0;

      padding: 8px 16px;

      background: #ffffff;

      color: #6b46c1;

      border:
        1.5px solid #d9c8ff;

      border-radius: 999px;
    }


    .logout-button:active {
      transform: scale(0.97);
    }


    /* ========================================
       工具區
    ======================================== */

    .toolbar {
      display: grid;

      grid-template-columns:
        minmax(0, 1fr)
        auto;

      gap: 9px;

      margin-bottom: 14px;
    }


    .search-input {
      width: 100%;

      padding: 11px 14px;

      background: #ffffff;

      color: #4f4660;

      border:
        1.5px solid #d9c8ff;

      border-radius: 999px;

      outline: none;
    }


    .search-input:focus {
      border-color: #a98be6;
    }


    .refresh-button {
      padding: 10px 17px;

      background: #eee6ff;

      color: #6842b3;

      border:
        1.5px solid #d9c8ff;

      border-radius: 999px;
    }


    /* ========================================
       篩選按鈕
    ======================================== */

    .filters {
      display: flex;

      flex-wrap: wrap;

      gap: 7px;

      margin-bottom: 18px;
    }


    .filter-button {
      padding: 7px 14px;

      background: #ffffff;

      color: #7457a5;

      border:
        1.5px solid #ded0f8;

      border-radius: 999px;
    }


    .filter-button.active {
      background: #dccfff;

      border-color: #b99bf5;

      color: #59349e;
    }


    /* ========================================
       統計
    ======================================== */

    .stats {
      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap: 9px;

      margin-bottom: 18px;
    }


    .stat-card {
      padding: 13px 8px;

      background: #ffffff;

      border:
        1px solid #eee6ff;

      border-radius: 17px;

      text-align: center;
    }


    .stat-number {
      color: #6b46c1;

      font-size: 23px;
      font-weight: 600;
    }


    .stat-label {
      margin-top: 2px;

      color: #988ba5;

      font-size: 12px;
    }


    /* ========================================
       訂單
    ======================================== */

    .submission-card {
      margin-bottom: 15px;

      overflow: hidden;

      background: #ffffff;

      border:
        1px solid #eee6ff;

      border-radius: 21px;

      box-shadow:
        0 5px 15px
        rgba(116, 82, 165, 0.07);
    }


    .submission-head {
      padding: 17px 18px;

      background: #f7f3fd;

      border-bottom:
        1px solid #eee6ff;
    }


    .activity-name {
      color: #5e3a9e;

      font-size: 18px;
      font-weight: 600;

      line-height: 1.5;
    }


    .submission-date {
      margin-top: 4px;

      color: #a094aa;

      font-size: 12px;
    }


    .submission-body {
      padding: 17px 18px;
    }


    .person-name {
      margin-bottom: 12px;

      color: #4f4660;

      font-size: 19px;
      font-weight: 600;
    }


    .info-grid {
      display: grid;

      grid-template-columns:
        repeat(2, minmax(0, 1fr));

      gap: 9px;

      margin-bottom: 15px;
    }


    .info-box {
      padding: 10px 12px;

      background: #faf8ff;

      border-radius: 13px;
    }


    .info-label {
      margin-bottom: 3px;

      color: #9a8da6;

      font-size: 11px;
    }


    .info-value {
      color: #594d68;

      font-size: 14px;

      line-height: 1.5;

      word-break: break-word;
    }


    /* ========================================
       商品
    ======================================== */

    .products-box {
      margin-bottom: 15px;

      padding: 12px 14px;

      background: #faf8ff;

      border-radius: 14px;
    }


    .section-label {
      margin-bottom: 8px;

      color: #7457a5;

      font-size: 14px;
      font-weight: 600;
    }


    .product-line {
      padding: 5px 0;

      color: #60546d;

      font-size: 14px;

      line-height: 1.5;

      border-bottom:
        1px dashed #e9e1f5;
    }


    .product-line:last-child {
      border-bottom: none;
    }


    /* ========================================
       備註
    ======================================== */

    .note-box {
      margin-bottom: 15px;

      padding: 11px 13px;

      background: #fffaf0;

      color: #74644a;

      border-radius: 13px;

      line-height: 1.6;
    }


    /* ========================================
       管理欄位
    ======================================== */

    .admin-controls {
      display: grid;

      grid-template-columns:
        repeat(2, minmax(0, 1fr));

      gap: 10px;

      margin-top: 13px;
    }


    .control-group label {
      display: block;

      margin-bottom: 6px;

      color: #756583;

      font-size: 13px;
      font-weight: 600;
    }


    .control-group select {
      width: 100%;

      padding: 9px 11px;

      background: #ffffff;

      color: #54495f;

      border:
        1.5px solid #ded0f8;

      border-radius: 12px;

      outline: none;
    }


    /* ========================================
       儲存
    ======================================== */

    .save-button {
      width: 100%;

      margin-top: 13px;

      padding: 10px 16px;

      background: #d8c8f7;

      color: #533494;

      border: none;

      border-radius: 999px;

      font-weight: 600;
    }


    .save-button.saved {
      background: #dff4e6;

      color: #287747;
    }


    .save-button:disabled {
      opacity: 0.55;
      cursor: default;
    }


    /* ========================================
       空白／讀取中
    ======================================== */

    .empty-card {
      padding: 35px 18px;

      background: #ffffff;

      color: #91869c;

      border:
        1px solid #eee6ff;

      border-radius: 20px;

      text-align: center;

      line-height: 1.8;
    }


    /* ========================================
       手機
    ======================================== */

    @media (max-width: 520px) {

      body {
        padding:
          22px 13px 40px;
      }


      .login-wrap {
        margin-top: 45px;
      }


      .main-title {
        font-size: 27px;
      }


      .admin-header-title {
        font-size: 23px;
      }


      .toolbar {
        grid-template-columns: 1fr;
      }


      .refresh-button {
        width: 100%;
      }


      .stats {
        gap: 6px;
      }


      .info-grid {
        grid-template-columns: 1fr;
      }


      .admin-controls {
        grid-template-columns: 1fr;
      }

    }

  </style>

</head>


<body>


  <!-- ========================================
       登入頁
  ======================================== -->

  <section
    id="loginPage"
    class="login-wrap"
  >

    <div class="main-title">
      狐狸🦊
    </div>


    <div class="subtitle">
      管理員後台
    </div>


    <div class="card login-card">

      <div class="login-icon">
        🦊
      </div>


      <div class="login-title">
        管理員登入
      </div>


      <form id="loginForm">

        <label
          class="login-label"
          for="adminPassword"
        >
          管理員密碼
        </label>


        <input
          id="adminPassword"
          class="password-input"
          type="password"
          autocomplete="current-password"
          placeholder="請輸入管理員密碼"
          required
        >


        <button
          id="loginButton"
          class="login-button"
          type="submit"
        >
          登入後台
        </button>


        <div
          id="loginMessage"
          class="login-message"
        ></div>

      </form>

    </div>

  </section>


  <!-- ========================================
       管理頁
  ======================================== -->

  <main
    id="adminPage"
    class="container hidden"
  >

    <div class="admin-header">

      <div class="admin-header-title">
        🦊 狐狸團務管理
      </div>


      <button
        id="logoutButton"
        class="logout-button"
        type="button"
      >
        登出
      </button>

    </div>


    <!-- 搜尋 -->

    <div class="toolbar">

      <input
        id="searchInput"
        class="search-input"
        type="search"
        placeholder="搜尋 Facebook 名稱、團務、商品…"
      >


      <button
        id="refreshButton"
        class="refresh-button"
        type="button"
      >
        ↻ 重新整理
      </button>

    </div>


    <!-- 篩選 -->

    <div
      id="filters"
      class="filters"
    >

      <button
        type="button"
        class="filter-button active"
        data-filter="all"
      >
        全部
      </button>


      <button
        type="button"
        class="filter-button"
        data-filter="需確認"
      >
        需確認
      </button>


      <button
        type="button"
        class="filter-button"
        data-filter="已匯款"
      >
        已匯款
      </button>


      <button
        type="button"
        class="filter-button"
        data-filter="未匯款"
      >
        未匯款
      </button>

    </div>


    <!-- 統計 -->

    <div class="stats">

      <div class="stat-card">

        <div
          id="totalCount"
          class="stat-number"
        >
          0
        </div>

        <div class="stat-label">
          全部
        </div>

      </div>


      <div class="stat-card">

        <div
          id="paidCount"
          class="stat-number"
        >
          0
        </div>

        <div class="stat-label">
          已匯款
        </div>

      </div>


      <div class="stat-card">

        <div
          id="checkCount"
          class="stat-number"
        >
          0
        </div>

        <div class="stat-label">
          需確認
        </div>

      </div>

    </div>


    <div id="submissionList">

      <div class="empty-card">
        尚未登入 🦊
      </div>

    </div>

  </main>


<script>


/* ========================================
   Worker
======================================== */

const WORKER_URL =
  "https://fox-form-api.a0983707826.workers.dev";


/* ========================================
   狀態
======================================== */

let adminPassword =
  "";


let submissions =
  [];


let currentFilter =
  "all";


/* ========================================
   DOM
======================================== */

const loginPage =
  document.getElementById(
    "loginPage"
  );


const adminPage =
  document.getElementById(
    "adminPage"
  );


const loginForm =
  document.getElementById(
    "loginForm"
  );


const adminPasswordInput =
  document.getElementById(
    "adminPassword"
  );


const loginButton =
  document.getElementById(
    "loginButton"
  );


const loginMessage =
  document.getElementById(
    "loginMessage"
  );


const logoutButton =
  document.getElementById(
    "logoutButton"
  );


const refreshButton =
  document.getElementById(
    "refreshButton"
  );


const searchInput =
  document.getElementById(
    "searchInput"
  );


const submissionList =
  document.getElementById(
    "submissionList"
  );


/* ========================================
   HTML 安全
======================================== */

function escapeHTML(value) {

  return String(
    value ?? ""
  )

    .replace(/&/g, "&amp;")

    .replace(/</g, "&lt;")

    .replace(/>/g, "&gt;")

    .replace(/"/g, "&quot;")

    .replace(/'/g, "&#039;");

}


/* ========================================
   日期格式
======================================== */

function formatDate(value) {

  if (!value) {
    return "";
  }


  const date =
    new Date(value);


  if (
    Number.isNaN(
      date.getTime()
    )
  ) {

    return String(value);

  }


  return date.toLocaleString(
    "zh-TW",
    {

      year: "numeric",
      month: "2-digit",
      day: "2-digit",

      hour: "2-digit",
      minute: "2-digit"

    }
  );

}


/* ========================================
   找出每筆資料的識別值

   相容：
   path
   filePath
   fileName
   filename
   id
======================================== */

function getSubmissionIdentifier(item) {

  return (

    item.path ||

    item.filePath ||

    item.fileName ||

    item.filename ||

    item.id ||

    item._id ||

    ""

  );

}


/* ========================================
   登入
======================================== */

loginForm.addEventListener(
  "submit",
  async event => {

    event.preventDefault();


    const password =
      adminPasswordInput
        .value
        .trim();


    if (!password) {
      return;
    }


    loginButton.disabled =
      true;


    loginButton.textContent =
      "登入中…";


    loginMessage.textContent =
      "";


    try {

      const result =
        await fetchAdminList(
          password
        );


      adminPassword =
        password;


      submissions =
        result;


      loginPage.classList.add(
        "hidden"
      );


      adminPage.classList.remove(
        "hidden"
      );


      searchInput.value =
        "";


      currentFilter =
        "all";


      document
        .querySelectorAll(
          ".filter-button"
        )
        .forEach(
          button => {

            button.classList.toggle(
              "active",
              button.dataset.filter ===
                "all"
            );

          }
        );


      renderSubmissions();

    }

    catch (error) {

      console.error(
        error
      );


      loginMessage.textContent =
        error.message ||
        "登入失敗，請確認密碼。";

    }

    finally {

      loginButton.disabled =
        false;


      loginButton.textContent =
        "登入後台";

    }

  }
);


/* ========================================
   讀取管理員資料
======================================== */

async function fetchAdminList(
  password = adminPassword
) {

  const response =
    await fetch(

      WORKER_URL +
      "/admin/list",

      {

        method:
          "POST",


        headers: {

          "Content-Type":
            "application/json"

        },


        body:
          JSON.stringify({

            password

          })

      }

    );


  let result;


  try {

    result =
      await response.json();

  }

  catch {

    throw new Error(
      "後台回傳格式錯誤。"
    );

  }


  if (
    !response.ok ||
    result.success === false
  ) {

    throw new Error(

      result.message ||
      "管理員密碼錯誤。"

    );

  }


  /*
    相容幾種列表格式
  */

  if (
    Array.isArray(
      result.submissions
    )
  ) {

    return result.submissions;

  }


  if (
    Array.isArray(
      result.data
    )
  ) {

    return result.data;

  }


  if (
    Array.isArray(
      result.items
    )
  ) {

    return result.items;

  }


  if (
    Array.isArray(
      result
    )
  ) {

    return result;

  }


  return [];

}


/* ========================================
   重新整理
======================================== */

refreshButton.addEventListener(
  "click",
  async () => {

    refreshButton.disabled =
      true;


    refreshButton.textContent =
      "讀取中…";


    try {

      submissions =
        await fetchAdminList();


      renderSubmissions();

    }

    catch (error) {

      alert(

        error.message ||
        "讀取失敗"

      );

    }

    finally {

      refreshButton.disabled =
        false;


      refreshButton.textContent =
        "↻ 重新整理";

    }

  }
);


/* ========================================
   登出
======================================== */

logoutButton.addEventListener(
  "click",
  () => {

    adminPassword =
      "";


    submissions =
      [];


    adminPasswordInput.value =
      "";


    searchInput.value =
      "";


    adminPage.classList.add(
      "hidden"
    );


    loginPage.classList.remove(
      "hidden"
    );


    loginMessage.textContent =
      "";


    window.scrollTo(
      0,
      0
    );

  }
);


/* ========================================
   篩選
======================================== */

document
  .querySelectorAll(
    ".filter-button"
  )
  .forEach(
    button => {

      button.addEventListener(
        "click",
        () => {

          document
            .querySelectorAll(
              ".filter-button"
            )
            .forEach(
              item => {

                item.classList.remove(
                  "active"
                );

              }
            );


          button.classList.add(
            "active"
          );


          currentFilter =
            button.dataset.filter;


          renderSubmissions();

        }
      );

    }
  );


/* ========================================
   搜尋
======================================== */

searchInput.addEventListener(
  "input",
  renderSubmissions
);


/* ========================================
   統計
======================================== */

function updateStats() {

  document
    .getElementById(
      "totalCount"
    )
    .textContent =
      submissions.length;


  document
    .getElementById(
      "paidCount"
    )
    .textContent =
      submissions.filter(
        item =>
          item.paymentStatus ===
          "已匯款"
      ).length;


  document
    .getElementById(
      "checkCount"
    )
    .textContent =
      submissions.filter(
        item =>
          item.paymentStatus ===
          "需確認"
      ).length;

}


/* ========================================
   顯示訂單
======================================== */

function renderSubmissions() {

  updateStats();


  const query =
    searchInput
      .value
      .trim()
      .toLowerCase();


  const filtered =
    submissions.filter(
      item => {

        const paymentStatus =
          String(
            item.paymentStatus ||
            "未匯款"
          );


        const matchesFilter =

          currentFilter ===
            "all"

          ||

          paymentStatus ===
            currentFilter;


        const productText =
          Array.isArray(
            item.products
          )

            ? item.products
                .map(
                  product =>
                    product.name ||
                    product.productName ||
                    ""
                )
                .join(" ")

            : "";


        const haystack = [

          item.facebookName,
          item.community,
          item.activity,
          item.group,
          item.groupType,
          productText,
          item.paymentBank,
          item.note

        ]

          .map(
            value =>
              String(
                value || ""
              )
                .toLowerCase()
          )

          .join(" ");


        const matchesSearch =

          !query ||

          haystack.includes(
            query
          );


        return (
          matchesFilter &&
          matchesSearch
        );

      }
    );


  submissionList.innerHTML =
    "";


  if (
    filtered.length === 0
  ) {

    submissionList.innerHTML = `

      <div class="empty-card">
        沒有符合條件的資料 🦊
      </div>

    `;


    return;

  }


  filtered.forEach(
    item => {

      const card =
        createSubmissionCard(
          item
        );


      submissionList
        .appendChild(
          card
        );

    }
  );

}


/* ========================================

======================================== */

      item
    );

      item.products

            product => {

                product.name ||

                product.productName ||

              return `

                <div class="product-line">

                  ${escapeHTML(

                </div>

              item.groupType ||

        </div>

  const paymentSelect =

  const progressSelect =
    element.querySelector(
      ".progress-select"
    );


  saveButton.addEventListener(
    "click",
    async () => {

      await updateSubmission({

        item,

        identifier,

        paymentStatus:
          paymentSelect.value,

        progress:
          progressSelect.value,

        button:
          saveButton

      });

    }
  );


  return element;

}


/* ========================================
   更新訂單
======================================== */

async function updateSubmission({

  item,
  identifier,
  paymentStatus,
  progress,
  button

}) {

  if (
    !identifier
  ) {

    alert(
      "找不到這筆資料的檔案識別值，無法更新。"
    );


    return;

  }


  button.disabled =
    true;


  button.textContent =
    "儲存中…";


  try {

    /*
      同時附上常見識別欄位，
      Worker 只需要取它原本使用的那一個即可。
    */

    const payload = {

      password:
        adminPassword,


      paymentStatus,

      progress,


      path:
        item.path ||
        identifier,


      filePath:
        item.filePath ||
        identifier,


      fileName:
        item.fileName ||
        item.filename ||
        identifier,


      filename:
        item.filename ||
        item.fileName ||
        identifier,


      id:
        item.id ||
        identifier

    };


    const response =
      await fetch(

        WORKER_URL +
        "/admin/update",

        {

          method:
            "POST",


          headers: {

            "Content-Type":
              "application/json"

          },


          body:
            JSON.stringify(
              payload
            )

        }

      );


    let result;


    try {

      result =
        await response.json();

    }

    catch {

      throw new Error(
        "後台回傳格式錯誤。"
      );

    }


    if (
      !response.ok ||
      result.success === false
    ) {

      throw new Error(

        result.message ||
        "更新失敗"

      );

    }


    /*
      本機同步狀態
    */

    item.paymentStatus =
      paymentStatus;


    item.progress =
      progress;


    button.classList.add(
      "saved"
    );


    button.textContent =
      "✓ 已儲存";


    updateStats();


    setTimeout(
      () => {

        button.classList.remove(
          "saved"
        );


        button.textContent =
          "儲存更新";

      },

      1200
    );

  }

  catch (error) {

    console.error(
      error
    );


    alert(

      error.message ||
      "更新失敗，請稍後再試。"

    );


    button.textContent =
      "儲存更新";

  }

  finally {

    button.disabled =
      false;

  }

}


</script>
