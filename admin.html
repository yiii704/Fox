<!DOCTYPE html>
<html lang="zh-TW">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="format-detection"
    content="telephone=no"
  >

  <title>
    狐狸🦊後台管理
  </title>


  <style>

    * {
      box-sizing: border-box;

      margin: 0;

      padding: 0;
    }


    body {
      min-height: 100vh;

      padding: 26px 16px;

      background: #faf8ff;

      color: #4f4660;

      font-family:
        "PingFang TC",
        "Microsoft JhengHei",
        sans-serif;
    }


    button,
    input,
    select {
      font: inherit;
    }


    button {
      cursor: pointer;
    }


    .container {
      width: 100%;

      max-width: 1400px;

      margin: 0 auto;
    }


    /* =====================================================
       Login
    ===================================================== */

    #loginPage {
      width: 100%;

      max-width: 430px;

      margin:
        80px auto 0;
    }


    .login-card {
      padding: 28px 24px;

      background: #ffffff;

      border:
        1px solid #eee6ff;

      border-radius: 24px;

      box-shadow:
        0 8px 26px
        rgba(116, 82, 165, 0.10);
    }


    .login-title {
      margin-bottom: 8px;

      color: #59349e;

      font-size: 26px;

      font-weight: 800;

      text-align: center;
    }


    .login-subtitle {
      margin-bottom: 22px;

      color: #968b9f;

      font-size: 14px;

      text-align: center;
    }


    .login-input {
      width: 100%;

      height: 50px;

      padding: 12px 15px;

      background: #ffffff;

      border:
        1.5px solid #d9c8ff;

      border-radius: 15px;

      outline: none;
    }


    .login-input:focus {
      border-color: #9f7aea;

      box-shadow:
        0 0 0 3px
        rgba(159, 122, 234, .12);
    }


    .login-button {
      width: 100%;

      margin-top: 14px;

      padding: 12px;

      background: #cbb8f5;

      color: #4c2e83;

      border: 0;

      border-radius: 999px;

      font-weight: 700;
    }


    .login-message {
      min-height: 20px;

      margin-top: 12px;

      color: #b34545;

      font-size: 13px;

      text-align: center;
    }


    /* =====================================================
       Admin
    ===================================================== */

    #adminPage {
      display: none;
    }


    .admin-header {
      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 16px;

      margin-bottom: 20px;
    }


    .admin-title {
      color: #59349e;

      font-size: 28px;

      font-weight: 800;
    }


    .admin-actions {
      display: flex;

      gap: 8px;
    }


    .top-button {
      padding: 8px 14px;

      background: #ffffff;

      color: #6b46c1;

      border:
        1.5px solid #d9c8ff;

      border-radius: 999px;

      font-weight: 600;
    }


    .summary-text {
      margin-bottom: 15px;

      color: #887b94;

      font-size: 14px;
    }


    /* =====================================================
       Filters
    ===================================================== */

    .admin-filter-card {
      margin-bottom: 18px;

      padding: 22px 20px;

      background: #ffffff;

      border:
        1px solid #eee6ff;

      border-radius: 23px;

      box-shadow:
        0 6px 18px
        rgba(116, 82, 165, 0.08);
    }


    .admin-filter-section {
      margin-bottom: 22px;
    }


    .admin-filter-section:last-child {
      margin-bottom: 0;
    }


    .admin-filter-title {
      margin-bottom: 10px;

      color: #807689;

      font-size: 17px;

      font-weight: 700;
    }


    .admin-filter-buttons {
      display: flex;

      align-items: center;

      flex-wrap: wrap;

      gap: 9px;
    }


    .filter-button {
      width: auto;

      min-width: 76px;

      padding: 9px 18px;

      background: #ffffff;

      color: #6b46c1;

      border:
        1.5px solid #d9c8ff;

      border-radius: 999px;

      font-size: 15px;

      font-weight: 500;
    }


    .filter-button.selected {
      background: #dccfff;

      border-color: #b99bf5;

      color: #59349e;
    }


    .admin-search-input {
      width: 100%;

      height: 50px;

      padding: 12px 16px;

      background: #ffffff;

      color: #4f4660;

      border:
        1.5px solid #d9c8ff;

      border-radius: 17px;

      outline: none;
    }


    /* =====================================================
       Empty
    ===================================================== */

    .empty-card {
      padding: 34px 20px;

      background: #ffffff;

      color: #93899c;

      border:
        1px solid #eee6ff;

      border-radius: 22px;

      text-align: center;
    }


    /* =====================================================
       Search person group
    ===================================================== */

    .person-search-group {
      margin-bottom: 18px;

      overflow: hidden;

      background: #ffffff;

      border:
        1px solid #e8ddfb;

      border-radius: 23px;
    }


    .person-search-header {
      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 12px;

      padding: 15px 18px;

      background: #eee6ff;
    }


    .person-search-name {
      color: #59349e;

      font-size: 21px;

      font-weight: 800;
    }


    .person-search-count {
      color: #8c7d9d;

      font-size: 13px;
    }


    .person-search-orders {
      padding: 12px;
    }


    /* =====================================================
       Submission Card
    ===================================================== */

    .submission-card {
      margin-bottom: 11px;

      overflow: hidden;

      background: #ffffff;

      border:
        1px solid #eee6ff;

      border-radius: 18px;

      box-shadow:
        0 4px 12px
        rgba(116, 82, 165, .06);
    }


    .person-search-orders
    .submission-card {
      border-radius: 15px;

      box-shadow: none;
    }


    .order-row {
      display: grid;

      grid-template-columns:
        135px
        minmax(180px, 1.35fr)
        95px
        minmax(190px, 1fr)
        minmax(180px, 1.1fr)
        220px;

      align-items: start;

      gap: 14px;

      padding: 16px;
    }


    .column-title,
    .mini-title {
      margin-bottom: 5px;

      color: #9a8ea5;

      font-size: 11px;

      font-weight: 700;
    }


    .person-name {
      color: #554b62;

      font-size: 15px;

      font-weight: 800;

      word-break: break-word;
    }


    .submitted-time {
      margin-top: 5px;

      color: #a097a6;

      font-size: 10px;

      line-height: 1.5;
    }


    .activity-name {
      color: #59349e;

      font-size: 14px;

      font-weight: 700;

      line-height: 1.5;

      word-break: break-word;
    }


    .activity-meta {
      display: flex;

      flex-wrap: wrap;

      gap: 5px;

      margin-top: 6px;
    }


    .type-pill,
    .group-pill {
      display: inline-flex;

      padding: 4px 7px;

      border-radius: 999px;

      font-size: 10px;

      font-weight: 700;
    }


    .type-pill {
      background: #eee3ff;

      color: #6842b3;
    }


    .type-pill.special {
      background: #ffe8f1;

      color: #a34d72;
    }


    .group-pill {
      background: #eef2ff;

      color: #596d9d;
    }


    .amount-value {
      color: #59349e;

      font-size: 15px;

      font-weight: 800;

      white-space: nowrap;
    }


    .payment-summary,
    .products-summary {
      min-width: 0;
    }


    .mini-value {
      color: #554b62;

      font-size: 11px;

      line-height: 1.55;
    }


    /* =====================================================
       匯款資料同一排
    ===================================================== */

    .payment-inline-value {
      display: flex;

      align-items: center;

      width: 100%;

      gap: 2px;

      color: #554b62;

      font-size: 11px;

      line-height: 1.55;

      white-space: nowrap;

      overflow-x: auto;

      -webkit-overflow-scrolling: touch;

      scrollbar-width: none;
    }


    .payment-inline-value::-webkit-scrollbar {
      display: none;
    }


    .payment-inline-value span {
      flex-shrink: 0;
    }


    .payment-divider {
      color: #b9afc1;
    }


    .product-line {
      margin-bottom: 3px;

      color: #554b62;

      font-size: 11px;

      line-height: 1.5;

      word-break: break-word;
    }


    .product-line:last-child {
      margin-bottom: 0;
    }


    /* =====================================================
       Status controls
    ===================================================== */

    .status-column {
      display: grid;

      grid-template-columns:
        1fr 1fr;

      gap: 7px;
    }


    .status-select {
      width: 100%;

      min-width: 0;

      padding: 8px 7px;

      background: #ffffff;

      color: #554b62;

      border:
        1px solid #ded1f6;

      border-radius: 10px;

      outline: none;

      font-size: 11px;
    }


    .save-button {
      grid-column:
        1 / -1;

      width: 100%;

      padding: 8px 10px;

      background: #dccfff;

      color: #59349e;

      border:
        1px solid #c5adf4;

      border-radius: 999px;

      font-size: 12px;

      font-weight: 700;
    }


    /* =====================================================
       ★ Delete button
    ===================================================== */

    .delete-button {
      grid-column:
        1 / -1;

      width: 100%;

      padding: 8px 10px;

      background: #fff3f3;

      color: #b34545;

      border:
        1px solid #f1c5c5;

      border-radius: 999px;

      font-size: 11px;

      font-weight: 700;
    }


    .delete-button.stock-delete {
      background: #fff7eb;

      color: #a56620;

      border-color: #f0d2aa;
    }


    .save-button:disabled,
    .delete-button:disabled {
      opacity: .55;

      cursor: default;
    }


    /* =====================================================
       Note
    ===================================================== */

    .note-row {
      padding:
        10px 16px 14px;

      background: #faf8ff;

      color: #766b80;

      border-top:
        1px solid #f0e9fa;

      font-size: 12px;

      line-height: 1.6;
    }


    .note-label {
      color: #9b8fa7;

      font-weight: 700;
    }


    /* =====================================================
       1000px
    ===================================================== */

    @media (max-width: 1000px) {

      .order-row {
        grid-template-columns:
          125px
          minmax(180px, 1.4fr)
          90px
          minmax(170px, 1fr)
          minmax(170px, 1fr);
      }


      .status-column {
        grid-column:
          1 / -1;

        grid-template-columns:
          1fr 1fr 130px 180px;
      }


      .save-button,
      .delete-button {
        grid-column:
          auto;
      }

    }


    /* =====================================================
       Mobile
    ===================================================== */

    @media (max-width: 650px) {

      body {
        padding: 18px 12px;
      }


      .admin-header {
        align-items: flex-start;

        flex-direction: column;
      }


      .admin-actions {
        width: 100%;
      }


      .top-button {
        flex: 1;
      }


      .admin-title {
        font-size: 24px;
      }


      .admin-filter-card {
        padding: 18px 15px;
      }


      .order-row {
        grid-template-columns:
          minmax(0, 1fr)
          auto;

        gap: 11px;

        padding: 14px;
      }


      .order-person {
        grid-column: 1;
      }


      .order-amount {
        grid-column: 2;

        text-align: right;
      }


      .order-activity,
      .payment-summary,
      .products-summary,
      .status-column {
        grid-column:
          1 / -1;
      }


      .order-activity {
        padding-top: 8px;

        border-top:
          1px dashed #eee4fa;
      }


      .payment-summary,
      .products-summary {
        padding-top: 8px;
      }


      .status-column {
        grid-template-columns:
          1fr 1fr;
      }


      .save-button,
      .delete-button {
        grid-column:
          1 / -1;
      }


      .person-search-header {
        align-items: flex-start;

        flex-direction: column;
      }


      .person-search-count {
        margin-top: -5px;
      }

    }

  </style>

</head>


<body>


<div class="container">


  <!-- =====================================================
       LOGIN
  ====================================================== -->

  <section id="loginPage">

    <div class="login-card">

      <div class="login-title">
        🦊 後台管理
      </div>


      <div class="login-subtitle">
        請輸入管理員密碼
      </div>


      <input
        id="passwordInput"
        class="login-input"
        type="password"
        placeholder="管理員密碼"

      >


      <button
        id="loginButton"

        type="button"

      </button>

        id="loginMessage"

      ></div>

    </div>

  </section>


  <!-- =====================================================
       ADMIN
  ====================================================== -->

  <section id="adminPage">

    <div class="admin-header">

      <div class="admin-title">
        🦊 對帳後台
      </div>


      <div class="admin-actions">

        <button
          id="refreshButton"
          class="top-button"
          type="button"
        >
          重新整理
        </button>


        <button
          id="logoutButton"
          class="top-button"
          type="button"
        >
          登出
        </button>

      </div>

    </div>


    <div
      id="summaryText"
      class="summary-text"
    >
      讀取中…
    </div>


    <!-- ===================================================
         FILTER
    ==================================================== -->

    <div class="admin-filter-card">


      <div class="admin-filter-section">

        <div class="admin-filter-title">
          依團務分類
        </div>


        <div
          id="typeFilters"
          class="admin-filter-buttons"
        >

          <button
            type="button"
            class="filter-button selected"
            data-filter="all"
          >
            全部
          </button>


          <button
            type="button"
            class="filter-button"
            data-filter="代購"
          >
            代購
          </button>


          <button
            type="button"
            class="filter-button"
            data-filter="單特典"
          >
            單特典
          </button>

        </div>

      </div>


      <div class="admin-filter-section">

        <div class="admin-filter-title">
          依團體
        </div>


        <div
          id="groupFilters"
          class="admin-filter-buttons"
        >

          <button
            type="button"
            class="filter-button selected"
            data-filter="all"
          >
            全部
          </button>


          <button
            type="button"
            class="filter-button"
            data-filter="TWS"
          >
            TWS
          </button>


          <button
            type="button"
            class="filter-button"
            data-filter="Stray Kids"
          >
            Stray Kids
          </button>

        </div>

      </div>


      <div class="admin-filter-section">

        <div class="admin-filter-title">
          依名稱搜尋
        </div>


        <input
          id="nameSearch"
          class="admin-search-input"
          type="search"
          placeholder="輸入 Facebook 名稱"
          autocomplete="off"
        >

      </div>

    </div>


    <div id="submissionsList"></div>

  </section>

</div>


<script>


/* =========================================================
   Worker
========================================================= */

const WORKER_URL =
  "https://fox-form-api.a0983707826.workers.dev";


/* =========================================================
   庫存團務
========================================================= */

const stockManagedGroups =
  new Set([

    "run-it-japan-kuji",

    "nagoya-0905",

    "osaka-0919",

    "osaka-0920",

    "fans-luck-draw-and-ver"

  ]);


/* =========================================================
   State
========================================================= */

let adminPassword =
  "";


let submissions =
  [];


let currentTypeFilter =
  "all";


let currentGroupFilter =
  "all";


/* =========================================================
   DOM
========================================================= */

const loginPage =
  document.getElementById(
    "loginPage"
  );


const adminPage =
  document.getElementById(
    "adminPage"
  );


const passwordInput =
  document.getElementById(
    "passwordInput"
  );


const loginButton =
  document.getElementById(
    "loginButton"
  );


const loginMessage =
  document.getElementById(
    "loginMessage"
  );


const refreshButton =
  document.getElementById(
    "refreshButton"
  );


const logoutButton =
  document.getElementById(
    "logoutButton"
  );


const summaryText =
  document.getElementById(
    "summaryText"
  );


const submissionsList =
  document.getElementById(
    "submissionsList"
  );


const nameSearch =
  document.getElementById(
    "nameSearch"
  );


/* =========================================================
   Escape
========================================================= */

function escapeHTML(
  value
) {

  return String(
    value ??
    ""
  )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


/* =========================================================
   Date
========================================================= */

function formatSubmittedAt(
  value
) {

  if (
    !value
  ) {

    return "";

  }


  const date =
    new Date(
      value
    );


  if (
    Number.isNaN(
      date.getTime()
    )
  ) {

    return String(
      value
    );

  }


  return date.toLocaleString(
    "zh-TW",
    {
      year:
        "numeric",

      month:
        "2-digit",

      day:
        "2-digit",

      hour:
        "2-digit",

      minute:
        "2-digit",

      hour12:
        false
    }
  );

}


/* =========================================================
   Products
========================================================= */

function createProductsHTML(
  item
) {

  const products =
    Array.isArray(
      item.products
    )
      ? item.products
      : [];


  if (
    !products.length
  ) {

    return `

      <div class="product-line">
        —
      </div>

    `;

  }


  return products
    .map(
      product => {

        const productName =
          String(
            product.productName ||
            ""
          ).trim();


        const variant =
          String(
            product.variant ||
            ""
          ).trim();


        const quantity =
          Math.max(
            1,
            Number(
              product.quantity ||
              1
            )
          );


        let text =
          "";


        if (
          productName
        ) {

          text =
            productName;


          if (
            variant
          ) {

            text +=
              `｜${variant}`;

          }


          text +=
            ` ×${quantity}`;

        }

        else {

          text =
            String(
              product.name ||
              "商品"
            );

        }


        return `

          <div class="product-line">

            ${escapeHTML(
              text
            )}

          </div>

        `;

      }
    )
    .join("");

}


/* =========================================================
   Create card
========================================================= */

function createSubmissionCard(
  item,
  realIndex,
  options = {}
) {

  const hidePersonName =
    options.hidePersonName ===
    true;


  const orderNumber =
    Number(
      options.orderNumber ||
      0
    );


  const stockManaged =
    stockManagedGroups.has(
      item.groupId
    );


  const personDisplay =
    hidePersonName

      ? `團務 ${orderNumber}`

      : (
          item.facebookName ||
          "未填名稱"
        );


  const typeClass =
    item.groupType ===
      "單特典"

      ? "special"

      : "";


  return `

    <article
      class="submission-card"
      data-index="${realIndex}"
    >


      <div class="order-row">


        <!-- 姓名 -->

        <div class="order-person">

          <div class="column-title">

            ${
              hidePersonName
                ? "編號"
                : "Facebook"
            }

          </div>


          <div class="person-name">

            ${escapeHTML(
              personDisplay
            )}

          </div>


          <div class="submitted-time">

            ${escapeHTML(
              formatSubmittedAt(
                item.submittedAt
              )
            )}

          </div>

        </div>


        <!-- 團務 -->

        <div class="order-activity">

          <div class="column-title">
            團務
          </div>


          <div class="activity-name">

            ${escapeHTML(

              item.activity ||

              item.community ||

              "—"

            )}

          </div>


          <div class="activity-meta">

            ${
              item.groupType

                ? `

                  <span
                    class="
                      type-pill
                      ${typeClass}
                    "
                  >

                    ${escapeHTML(
                      item.groupType
                    )}

                  </span>

                `

                : ""
            }


            ${
              item.group

                ? `

                  <span class="group-pill">

                    ${escapeHTML(
                      item.group
                    )}

                  </span>

                `

                : ""
            }

          </div>

        </div>


        <!-- 金額 -->

        <div class="order-amount">

          <div class="column-title">
            金額
          </div>


          <div class="amount-value">

            NT$
            ${Number(
              item.paymentAmount ||
              0
            ).toLocaleString(
              "zh-TW"
            )}

          </div>

        </div>


        <!-- 匯款 -->

        <div class="payment-summary">

          <div class="mini-title">
            匯款資料
          </div>


          <div class="payment-inline-value">

            <span>

              ${escapeHTML(
                item.paymentBank ||
                "—"
              )}

            </span>


            <span class="payment-divider">
              ｜
            </span>


            <span>

              ${escapeHTML(
                item.accountLastFive ||
                "—"
              )}

            </span>


            <span class="payment-divider">
              ｜
            </span>


            <span>

              ${escapeHTML(
                item.paymentDate ||
                "—"
              )}

            </span>


            <span class="payment-divider">
              ｜
            </span>


            <span>

              ${escapeHTML(
                item.paymentTime ||
                "—"
              )}

            </span>

          </div>

        </div>


        <!-- 商品 -->

        <div class="products-summary">

          <div class="mini-title">
            商品
          </div>


          ${createProductsHTML(
            item
          )}

        </div>


        <!-- 狀態 -->

        <div class="status-column">


          <select
            class="status-select payment-status-select"
          >

            ${[
              "待對帳",
              "已匯款",
              "需確認"
            ]
              .map(
                value => `

                  <option
                    value="${value}"

                    ${
                      (
                        item.paymentStatus ||
                        "待對帳"
                      ) === value
                        ? "selected"
                        : ""
                    }
                  >

                    ${value}

                  </option>

                `
              )
              .join("")}

          </select>


          <select
            class="status-select progress-select"
          >

            ${[
              "已登記",
              "已下單",
              "已到貨",
              "已寄出",
              "已完成"
            ]
              .map(
                value => `

                  <option
                    value="${value}"

                    ${
                      (
                        item.progress ||
                        "已登記"
                      ) === value
                        ? "selected"
                        : ""
                    }
                  >

                    ${value}

                  </option>

                `
              )
              .join("")}

          </select>


          <button
            type="button"
            class="save-button"
            onclick="saveSubmission(${realIndex}, this)"
          >
            儲存狀態
          </button>


          <!-- ★ 刪除 -->

          <button
            type="button"
            class="
              delete-button
              ${stockManaged ? "stock-delete" : ""}
            "
            onclick="deleteSubmission(${realIndex}, this)"
          >

            ${
              stockManaged

                ? "刪除並恢復庫存"

                : "刪除資料"
            }

          </button>

        </div>

      </div>


      ${
        item.note

          ? `

            <div class="note-row">

              <span class="note-label">
                備註：
              </span>

              ${escapeHTML(
                item.note
              )}

            </div>

          `

          : ""
      }

    </article>

  `;

}


/* =========================================================
   Login
========================================================= */

async function login() {

  const password =
    passwordInput
      .value
      .trim();


  if (
    !password
  ) {

    loginMessage.textContent =
      "請輸入管理員密碼";

    return;

  }


  adminPassword =
    password;


  loginButton.disabled =
    true;


  loginButton.textContent =
    "登入中…";


  loginMessage.textContent =
    "";


  try {

    const success =
      await loadSubmissions(
        true
      );


    if (
      !success
    ) {

      adminPassword =
        "";

      return;

    }


    loginPage.style.display =
      "none";


    adminPage.style.display =
      "block";

  }

  finally {

    loginButton.disabled =
      false;


    loginButton.textContent =
      "登入";

  }

}


/* =========================================================
   Load
========================================================= */

async function loadSubmissions(
  loginAttempt = false
) {

  if (
    !adminPassword
  ) {

    return false;

  }


  summaryText.textContent =
    "資料讀取中…";


  submissionsList.innerHTML = `

    <div class="empty-card">
      讀取中… 🦊
    </div>

  `;


  try {

    const response =
      await fetch(

        WORKER_URL +
        "/admin/list",

        {
          method:
            "POST",

          headers: {

            "Content-Type":
              "application/json",

            "X-Admin-Password":
              adminPassword

          },

          body:
            JSON.stringify(
              {}
            )

        }

      );


    const result =
      await response.json();


    if (
      !response.ok ||
      !result.success
    ) {

      if (
        loginAttempt
      ) {

        loginMessage.textContent =
          result.message ||
          "登入失敗";

      }

      else {

        alert(
          result.message ||
          "資料讀取失敗"
        );

      }


      return false;

    }


    submissions =
      Array.isArray(
        result.submissions
      )
        ? result.submissions
        : [];


    renderSubmissions();


    return true;

  }

  catch(error) {

    console.error(
      error
    );


    if (
      loginAttempt
    ) {

      loginMessage.textContent =
        "目前無法連線到後台";

    }

    else {

      alert(
        "目前無法讀取資料"
      );

    }


    return false;

  }

}


/* =========================================================
   Render
========================================================= */

function renderSubmissions() {

  const keyword =
    nameSearch
      .value
      .trim()
      .toLowerCase();


  const filtered =
    submissions

      .map(
        (item, index) => ({

          item,

          realIndex:
            index

        })
      )

      .filter(
        entry => {

          const item =
            entry.item;


          const matchesType =
            currentTypeFilter ===
              "all"

            ||

            item.groupType ===
              currentTypeFilter;


          const matchesGroup =
            currentGroupFilter ===
              "all"

            ||

            item.group ===
              currentGroupFilter;


          const facebookName =
            String(
              item.facebookName ||
              ""
            )
              .trim()
              .toLowerCase();


          const matchesName =
            !keyword

            ||

            facebookName.includes(
              keyword
            );


          return (

            matchesType

            &&

            matchesGroup

            &&

            matchesName

          );

        }
      );


  summaryText.textContent =
    `共 ${filtered.length} 筆資料`;


  if (
    !filtered.length
  ) {

    submissionsList.innerHTML = `

      <div class="empty-card">

        目前沒有符合的資料 🦊

      </div>

    `;


    return;

  }


  /* =======================================================
     一般模式
  ======================================================= */

  if (
    !keyword
  ) {

    submissionsList.innerHTML =
      filtered
        .map(
          entry =>
            createSubmissionCard(

              entry.item,

              entry.realIndex

            )
        )
        .join("");


    return;

  }


  /* =======================================================
     搜尋名字模式
  ======================================================= */

  const people =
    {};


  filtered.forEach(
    entry => {

      const name =
        String(

          entry.item
            .facebookName

          ||

          "未填名稱"

        ).trim();


      if (
        !people[
          name
        ]
      ) {

        people[
          name
        ] =
          [];

      }


      people[
        name
      ].push(
        entry
      );

    }
  );


  submissionsList.innerHTML =
    Object
      .entries(
        people
      )
      .map(
        ([name, entries]) => `

          <section class="person-search-group">


            <div class="person-search-header">

              <div class="person-search-name">

                ${escapeHTML(
                  name
                )}

              </div>


              <div class="person-search-count">

                共參加
                ${entries.length}
                筆團務

              </div>

            </div>


            <div class="person-search-orders">

              ${entries
                .map(
                  (
                    entry,
                    orderIndex
                  ) =>

                    createSubmissionCard(

                      entry.item,

                      entry.realIndex,

                      {
                        hidePersonName:
                          true,

                        orderNumber:
                          orderIndex + 1
                      }

                    )

                )
                .join("")}

            </div>

          </section>

        `
      )
      .join("");

}


/* =========================================================
   Save
========================================================= */

async function saveSubmission(
  realIndex,
  button
) {

  const item =
    submissions[
      realIndex
    ];


  if (
    !item
  ) {

    return;

  }


  const card =
    button.closest(
      ".submission-card"
    );


  const paymentStatus =
    card
      .querySelector(
        ".payment-status-select"
      )
      .value;


  const progress =
    card
      .querySelector(
        ".progress-select"
      )
      .value;


  const originalText =
    button.textContent;


  button.disabled =
    true;


  button.textContent =
    "儲存中…";


  try {

    const response =
      await fetch(

        WORKER_URL +
        "/admin/update",

        {
          method:
            "POST",

          headers: {

            "Content-Type":
              "application/json",

            "X-Admin-Password":
              adminPassword

          },

          body:
            JSON.stringify(
              {
                path:
                  item._path,

                paymentStatus,

                progress
              }
            )

        }

      );


    const result =
      await response.json();


    if (
      !response.ok ||
      !result.success
    ) {

      alert(
        result.message ||
        "儲存失敗"
      );


      return;

    }


    submissions[
      realIndex
    ].paymentStatus =
      paymentStatus;


    submissions[
      realIndex
    ].progress =
      progress;


    button.textContent =
      "✓ 已儲存";


    setTimeout(
      () => {

        button.textContent =
          originalText;

      },
      1100
    );

  }

  catch(error) {

    console.error(
      error
    );


    alert(
      "目前無法儲存資料"
    );

  }

  finally {

    button.disabled =
      false;

  }

}


/* =========================================================
   ★ Delete
========================================================= */

async function deleteSubmission(
  realIndex,
  button
) {

  const item =
    submissions[
      realIndex
    ];


  if (
    !item
  ) {

    return;

  }


  const stockManaged =
    stockManagedGroups.has(
      item.groupId
    );


  const activity =
    item.activity ||
    item.community ||
    "此團務";


  const facebookName =
    item.facebookName ||
    "此客人";


  const confirmMessage =
    stockManaged

      ? (
          `確定要刪除這筆資料嗎？\n\n`
          +
          `${facebookName}\n`
          +
          `${activity}\n\n`
          +
          `此操作會：\n`
          +
          `1. 刪除這筆對帳資料\n`
          +
          `2. 自動把此筆訂單的商品庫存補回\n\n`
          +
          `確定要繼續嗎？`
        )

      : (
          `確定要刪除這筆資料嗎？\n\n`
          +
          `${facebookName}\n`
          +
          `${activity}\n\n`
          +
          `刪除後將不會出現在後台與公開對帳表。`
        );


  const confirmed =
    window.confirm(
      confirmMessage
    );


  if (
    !confirmed
  ) {

    return;

  }


  const originalText =
    button.textContent;


  button.disabled =
    true;


  button.textContent =
    stockManaged

      ? "恢復庫存並刪除中…"

      : "刪除中…";


  try {

    const response =
      await fetch(

        WORKER_URL +
        "/admin/delete",

        {
          method:
            "POST",

          headers: {

            "Content-Type":
              "application/json",

            "X-Admin-Password":
              adminPassword

          },

          body:
            JSON.stringify(
              {
                path:
                  item._path
              }
            )

        }

      );


    const result =
      await response.json();


    if (
      !response.ok ||
      !result.success
    ) {

      alert(
        result.message ||
        "刪除失敗"
      );


      return;

    }


    alert(
      result.message ||
      "資料已刪除"
    );


    await loadSubmissions();

  }

  catch(error) {

    console.error(
      error
    );


    alert(
      "目前無法刪除資料"
    );

  }

  finally {

    button.disabled =
      false;


    button.textContent =
      originalText;

  }

}


/* =========================================================
   Filters
========================================================= */

document
  .querySelectorAll(
    "#typeFilters .filter-button"
  )
  .forEach(
    button => {

      button.addEventListener(
        "click",
        () => {

          document
            .querySelectorAll(
              "#typeFilters .filter-button"
            )
            .forEach(
              item => {

                item.classList.remove(
                  "selected"
                );

              }
            );


          button.classList.add(
            "selected"
          );


          currentTypeFilter =
            button.dataset.filter;


          renderSubmissions();

        }
      );

    }
  );


document
  .querySelectorAll(
    "#groupFilters .filter-button"
  )
  .forEach(
    button => {

      button.addEventListener(
        "click",
        () => {

          document
            .querySelectorAll(
              "#groupFilters .filter-button"
            )
            .forEach(
              item => {

                item.classList.remove(
                  "selected"
                );

              }
            );


          button.classList.add(
            "selected"
          );


          currentGroupFilter =
            button.dataset.filter;


          renderSubmissions();

        }
      );

    }
  );


nameSearch.addEventListener(
  "input",
  renderSubmissions
);


/* =========================================================
   Buttons
========================================================= */

loginButton.addEventListener(
  "click",
  login
);


passwordInput.addEventListener(
  "keydown",
  event => {

    if (
      event.key ===
      "Enter"
    ) {

      login();

    }

  }
);


refreshButton.addEventListener(
  "click",
  async () => {

    refreshButton.disabled =
      true;


    refreshButton.textContent =
      "更新中…";


    await loadSubmissions();


    refreshButton.disabled =
      false;


    refreshButton.textContent =
      "重新整理";

  }
);


logoutButton.addEventListener(
  "click",
  () => {

    adminPassword =
      "";


    submissions =
      [];


    passwordInput.value =
      "";


    adminPage.style.display =
      "none";


    loginPage.style.display =
      "block";


    loginMessage.textContent =
      "";

  }
);


</script>
