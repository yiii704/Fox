<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="format-detection"
    content="telephone=no"
  >

  <title>狐狸🦊 管理後台</title>

  <style>

    /* =========================
       基本設定
    ========================= */

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      min-height: 100%;
    }

    body {
      min-height: 100vh;

      padding:
        28px 16px 60px;

      background:
        #faf8ff;

      color:
        #4f4660;

      font-family:
        "PingFang TC",
        "Microsoft JhengHei",
        sans-serif;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }


    /* =========================
       外框
    ========================= */

    .container {
      width: 100%;

      max-width: 1000px;

      margin:
        0 auto;
    }


    /* =========================
       標題
    ========================= */

    h1 {
      margin-bottom:
        8px;

      color:
        #6b46c1;

      font-size:
        28px;

      text-align:
        center;
    }

    .subtitle {
      margin-bottom:
        26px;

      color:
        #9589a7;

      font-size:
        14px;

      text-align:
        center;
    }


    /* =========================
       卡片
    ========================= */

    .card {
      margin-bottom:
        18px;

      padding:
        22px;

      background:
        #ffffff;

      border:
        1px solid #eee6ff;

      border-radius:
        24px;

      box-shadow:
        0 8px 24px
        rgba(107, 70, 193, 0.06);
    }


    /* =========================
       登入
    ========================= */

    #adminPage {
      display:
        none;
    }

    .login-card {
      max-width:
        430px;

      margin:
        50px auto 0;
    }

    .login-icon {
      margin-bottom:
        12px;

      font-size:
        40px;

      text-align:
        center;
    }

    .login-title {
      margin-bottom:
        18px;

      color:
        #6b46c1;

      font-size:
        20px;

      font-weight:
        700;

      text-align:
        center;
    }

    label {
      display:
        block;

      margin-bottom:
        8px;

      color:
        #6d6379;

      font-size:
        14px;

      font-weight:
        600;
    }

    input,
    select {
      width:
        100%;

      padding:
        13px 15px;

      background:
        #ffffff;

      color:
        #4f4660;

      border:
        1.5px solid #ded1fa;

      border-radius:
        16px;

      outline:
        none;
    }

    input:focus,
    select:focus {
      border-color:
        #b99bf5;
    }

    .login-button {
      width:
        100%;

      margin-top:
        16px;

      padding:
        13px 18px;

      background:
        #dccfff;

      color:
        #59349e;

      border:
        1.5px solid #b99bf5;

      border-radius:
        999px;

      font-weight:
        700;
    }

    .login-button:active {
      transform:
        scale(0.98);
    }

    .login-button:disabled {
      opacity:
        0.55;

      cursor:
        default;
    }

    .error-text {
      min-height:
        20px;

      margin-top:
        12px;

      color:
        #c55b73;

      font-size:
        13px;

      text-align:
        center;
    }


    /* =========================
       後台上方按鈕
    ========================= */

    .top-actions {
      display:
        flex;

      gap:
        10px;

      margin-bottom:
        18px;
    }

    .small-button {
      flex:
        1;

      padding:
        10px 14px;

      background:
        #ffffff;

      color:
        #6b46c1;

      border:
        1.5px solid #d9c8ff;

      border-radius:
        999px;

      font-weight:
        600;
    }

    .small-button:hover {
      background:
        #f7f2ff;
    }

    .small-button:active {
      transform:
        scale(0.98);
    }

    .small-button:disabled {
      opacity:
        0.55;

      cursor:
        default;
    }


    /* =========================
       統計
    ========================= */

    .summary-card {
      display:
        flex;

      align-items:
        center;

      justify-content:
        space-between;
    }

    .summary-label {
      color:
        #867a94;

      font-size:
        14px;
    }

    .summary-number {
      color:
        #6b46c1;

      font-size:
        25px;

      font-weight:
        700;
    }


    /* =========================
       搜尋
    ========================= */

    .search-box {
      margin-bottom:
        18px;
    }


    /* =========================
       匯款資料列表
       一筆一整排
    ========================= */

    #submissionList {
      display:
        grid;

      grid-template-columns:
        1fr;

      gap:
        14px;
    }

    .submission-card {
      width:
        100%;

      margin-bottom:
        0;

      padding:
        18px;
    }


    /* =========================
       卡片最上方
    ========================= */

    .submission-header {
      display:
        flex;

      align-items:
        flex-start;

      justify-content:
        space-between;

      gap:
        16px;

      margin-bottom:
        14px;
    }

    .submission-main {
      min-width:
        0;

      flex:
        1;
    }

    .person-name {
      color:
        #59349e;

      font-size:
        18px;

      font-weight:
        700;

      line-height:
        1.4;

      word-break:
        break-word;
    }

    .community-name {
      margin-top:
        5px;

      color:
        #92859f;

      font-size:
        13px;

      line-height:
        1.55;

      word-break:
        break-word;
    }

    .amount-pill {
      flex-shrink:
        0;

      padding:
        7px 13px;

      background:
        #f1eaff;

      color:
        #6b46c1;

      border-radius:
        999px;

      font-size:
        14px;

      font-weight:
        700;
    }


    /* =========================
       ★ 匯款資料改成橫向
    ========================= */

    .info-grid {
      display:
        grid;

      grid-template-columns:
        repeat(4, minmax(0, 1fr));

      gap:
        8px;

      margin-bottom:
        13px;
    }

    .info-item {
      min-width:
        0;

      padding:
        11px 12px;

      background:
        #fbf9ff;

      border:
        1px solid #f0e9fb;

      border-radius:
        14px;
    }

    .info-label {
      margin-bottom:
        4px;

      color:
        #a095ac;

      font-size:
        11px;
    }

    .info-value {
      color:
        #554b62;

      font-size:
        13px;

      line-height:
        1.5;

      word-break:
        break-word;
    }


    /* =========================
       商品
    ========================= */

    .product-box {
      margin-bottom:
        12px;

      padding:
        12px 14px;

      background:
        #fbf9ff;

      border-radius:
        14px;
    }

    .product-title {
      margin-bottom:
        7px;

      color:
        #998ca4;

      font-size:
        11px;

      font-weight:
        600;
    }

    .product-line {
      padding:
        4px 0;

      color:
        #554b62;

      font-size:
        13px;

      line-height:
        1.6;

      word-break:
        break-word;
    }


    /* =========================
       備註
    ========================= */

    .note-box {
      margin-bottom:
        12px;

      padding:
        11px 13px;

      background:
        #fffafc;

      border-radius:
        14px;
    }

    .note-title {
      margin-bottom:
        4px;

      color:
        #a58b98;

      font-size:
        11px;

      font-weight:
        600;
    }

    .note-text {
      color:
        #62545c;

      font-size:
        13px;

      line-height:
        1.6;

      white-space:
        pre-wrap;

      word-break:
        break-word;
    }


    /* =========================
       狀態
       兩格橫排
    ========================= */

    .status-area {
      display:
        grid;

      grid-template-columns:
        repeat(2, minmax(0, 1fr));

      gap:
        10px;

      margin-top:
        4px;
    }

    .status-area label {
      margin-bottom:
        5px;

      font-size:
        12px;
    }

    .status-area select {
      padding:
        10px 11px;

      border-radius:
        13px;

      font-size:
        13px;
    }


    /* =========================
       儲存
    ========================= */

    .save-button {
      width:
        100%;

      margin-top:
        12px;

      padding:
        10px 12px;

      background:
        #dccfff;

      color:
        #59349e;

      border:
        1.5px solid #b99bf5;

      border-radius:
        999px;

      font-size:
        13px;

      font-weight:
        700;
    }

    .save-button:active {
      transform:
        scale(0.98);
    }

    .save-button:disabled {
      opacity:
        0.55;

      cursor:
        default;
    }

    .save-button.saved {
      background:
        #e4f5e8;

      color:
        #287747;

      border-color:
        #b8dfc4;
    }


    /* =========================
       空資料
    ========================= */

    .empty-box {
      width:
        100%;

      padding:
        45px 20px;

      color:
        #9a8da7;

      text-align:
        center;
    }


    /* =========================
       手機
    ========================= */

    @media (max-width: 600px) {

      body {
        padding:
          24px 12px 50px;
      }

      h1 {
        font-size:
          26px;
      }

      .card {
        border-radius:
          21px;
      }

      .submission-card {
        padding:
          14px;
      }


      /* 手機姓名和金額 */

      .submission-header {
        gap:
          8px;
      }

      .person-name {
        font-size:
          16px;
      }

      .community-name {
        font-size:
          11px;
      }

      .amount-pill {
        padding:
          6px 9px;

        font-size:
          12px;
      }


      /* ★ 手機變 2 × 2 */

      .info-grid {
        grid-template-columns:
          repeat(2, minmax(0, 1
