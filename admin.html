<!DOCTYPE html>
<html lang="zh-TW">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="format-detection"
    content="telephone=no"
  >

  <title>狐狸🦊 管理後台</title>


  <style>

    /* =====================================================
       基本
    ===================================================== */

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      padding: 28px 16px 60px;

      background: #faf8ff;
      color: #4f4660;

      font-family:
        "PingFang TC",
        "Microsoft JhengHei",
        sans-serif;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }


    /* =====================================================
       外框
    ===================================================== */

    .container {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
    }


    /* =====================================================
       標題
    ===================================================== */

    h1 {
      margin-bottom: 7px;

      color: #6b46c1;

      font-size: 28px;
      text-align: center;
    }

    .subtitle {
      margin-bottom: 26px;

      color: #9589a7;

      font-size: 14px;
      text-align: center;
    }


    /* =====================================================
       共用卡片
    ===================================================== */

    .card {
      margin-bottom: 18px;
      padding: 22px;

      background: #ffffff;

      border:
        1px solid #eee6ff;

      border-radius: 24px;

      box-shadow:
        0 8px 24px
        rgba(107, 70, 193, 0.06);
    }


    /* =====================================================
       表單
    ===================================================== */

    label {
      display: block;
      margin-bottom: 7px;

      color: #6d6379;

      font-size: 13px;
      font-weight: 600;
    }

    input,
    select {
      display: block;

      width: 100%;
      min-width: 0;

      padding: 11px 13px;

      background: #ffffff;
      color: #4f4660;

      border:
        1.5px solid #ded1fa;

      border-radius: 14px;

      outline: none;
    }

    input:focus,
    select:focus {
      border-color: #b99bf5;

      box-shadow:
        0 0 0 3px
        rgba(185, 155, 245, 0.10);
    }


    /* =====================================================
       登入
    ===================================================== */

    #adminPage {
      display: none;
    }

    .login-card {
      max-width: 430px;
      margin: 50px auto 0;
    }

    .login-icon {
      margin-bottom: 12px;

      font-size: 40px;
      text-align: center;
    }

    .login-title {
      margin-bottom: 18px;

      color: #6b46c1;

      font-size: 20px;
      font-weight: 700;
      text-align: center;
    }

    .login-button {
      width: 100%;

      margin-top: 16px;
      padding: 13px 18px;

      background: #dccfff;
      color: #59349e;

      border:
        1.5px solid #b99bf5;

      border-radius: 999px;

      font-weight: 700;
    }

    .login-button:active {
      transform: scale(0.98);
    }

    .login-button:disabled {
      opacity: 0.55;
      cursor: default;
    }

    .error-text {
      min-height: 20px;

      margin-top: 12px;

      color: #c55b73;

      font-size: 13px;
      text-align: center;
    }


    /* =====================================================
       上方操作
    ===================================================== */

    .top-actions {
      display: flex;
      gap: 10px;
      margin-bottom: 18px;
    }

    .small-button {
      flex: 1;

      padding: 10px 14px;

      background: #ffffff;
      color: #6b46c1;

      border:
        1.5px solid #d9c8ff;

      border-radius: 999px;

      font-weight: 600;
    }

    .small-button:active {
      transform: scale(0.98);
    }

    .small-button:disabled {
      opacity: 0.55;
      cursor: default;
    }


    /* =====================================================
       統計
    ===================================================== */

    .summary-card {
      display: flex;

      align-items: center;
      justify-content: space-between;
    }

    .summary-label {
      color: #867a94;
      font-size: 14px;
    }

    .summary-number {
      color: #6b46c1;

      font-size: 25px;
      font-weight: 700;
    }


    /* =====================================================
       篩選卡片
    ===================================================== */

    .admin-filter-card {
      padding: 22px 20px;
    }

    .admin-filter-section {
      margin-bottom: 22px;
    }

    .admin-filter-section:last-child {
      margin-bottom: 0;
    }

    .admin-filter-title {
      margin-bottom: 10px;

      color: #807689;

      font-size: 17px;
      font-weight: 700;
    }

    .admin-filter-buttons {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 9px;
    }

    .filter-button {
      width: auto;
      min-width: 76px;

      padding: 9px 18px;

      background: #ffffff;
      color: #6b46c1;

      border:
        1.5px solid #d9c8ff;

      border-radius: 999px;

      font-size: 15px;
      font-weight: 500;

      transition: 0.2s ease;
    }

    .filter-button.selected {
      background: #dccfff;
      border-color: #b99bf5;
      color: #59349e;
    }

    .filter-button:active {
      transform: scale(0.97);
    }

    .admin-search-input {
      width: 100%;
      height: 50px;

      padding: 12px 16px;

      background: #ffffff;

      border:
        1.5px solid #d9c8ff;

      border-radius: 17px;

      font-size: 15px;
    }

    .admin-search-input::placeholder {
      color: #aaa5ad;
    }


    /* =====================================================
       對帳列表
    ===================================================== */

    #submissionList {
      width: 100%;
    }


    /* =====================================================
       橫向訂單卡片
    ===================================================== */

    .submission-card {
      width: 100%;

      margin-bottom: 12px;
      padding: 14px 16px;

      background: #ffffff;

      border:
        1px solid #eee6ff;

      border-radius: 19px;

      box-shadow:
        0 5px 15px
        rgba(107, 70, 193, 0.055);
    }


    /*
      電腦：
      名稱｜團務｜金額｜匯款｜商品｜狀態
    */

    .order-row {
      display: grid;

      grid-template-columns:
        135px
        minmax(180px, 1.35fr)
        95px
        minmax(155px, 1fr)
        minmax(170px, 1.1fr)
        210px;

      align-items: center;

      gap: 11px;
    }


    /* =====================================================
       名稱
    ===================================================== */

    .order-person {
      min-width: 0;
    }

    .person-name {
      color: #59349e;

      font-size: 16px;
      font-weight: 700;

      line-height: 1.45;

      word-break: break-word;
    }

    .submitted-time {
      margin-top: 4px;

      color: #a096a9;

      font-size: 10px;

      line-height: 1.4;
    }


    /* =====================================================
       團務
    ===================================================== */

    .order-activity {
      min-width: 0;
    }

    .activity-name {
      color: #554b62;

      font-size: 13px;
      font-weight: 600;

      line-height: 1.5;

      word-break: break-word;
    }

    .activity-meta {
      display: flex;
      flex-wrap: wrap;

      gap: 5px;

      margin-top: 6px;
    }

    .type-pill,
    .group-pill {
      display: inline-flex;

      padding: 4px 8px;

      border-radius: 999px;

      font-size: 10px;
      font-weight: 600;
    }

    .type-pill {
      background: #eee3ff;
      color: #6842b3;
    }

    .type-pill.special {
      background: #ffe8f1;
      color: #a34d72;
    }

    .group-pill {
      background: #f2f1f4;
      color: #716b78;
    }


    /* =====================================================
       金額
    ===================================================== */

    .order-amount {
      min-width: 0;
    }

    .amount-label {
      margin-bottom: 4px;

      color: #a095ac;

      font-size: 10px;
    }

    .amount-value {
      color: #6b46c1;

      font-size: 15px;
      font-weight: 700;

      white-space: nowrap;
    }


    /* =====================================================
       匯款資料
    ===================================================== */

    .payment-summary {
      min-width: 0;

      padding: 9px 10px;

      background: #fbf9ff;

      border-radius: 12px;
    }

    .mini-title {
      margin-bottom: 4px;

      color: #9f94aa;

      font-size: 10px;
    }

    .mini-value {
      color: #554b62;

      font-size: 11px;

      line-height: 1.55;

      word-break: break-word;
    }


    /* =====================================================
       商品
    ===================================================== */

    .products-summary {
      min-width: 0;

      padding: 9px 10px;

      background: #fbf9ff;

      border-radius: 12px;
    }

    .product-line {
      color: #554b62;

      font-size: 11px;

      line-height: 1.55;

      word-break: break-word;
    }

    .product-line + .product-line {
      margin-top: 3px;
    }


    /* =====================================================
       狀態
    ===================================================== */

    .status-column {
      min-width: 0;
    }

    .status-selects {
      display: grid;

      grid-template-columns:
        repeat(2, minmax(0, 1fr));

      gap: 6px;
    }

    .status-box label {
      margin-bottom: 4px;

      font-size: 10px;
    }

    .status-box select {
      padding: 8px 7px;

      border-radius: 11px;

      font-size: 11px;
    }


    /* =====================================================
       儲存
    ===================================================== */

    .save-button {
      width: 100%;

      margin-top: 7px;
      padding: 8px 10px;

      background: #dccfff;
      color: #59349e;

      border:
        1.5px solid #b99bf5;

      border-radius: 999px;

      font-size: 11px;
      font-weight: 700;
    }

    .save-button:active {
      transform: scale(0.98);
    }

    .save-button:disabled {
      opacity: 0.55;
      cursor: default;
    }

    .save-button.saved {
      background: #e4f5e8;
      color: #287747;

      border-color: #b8dfc4;
    }


    /* =====================================================
       備註
    ===================================================== */

    .note-row {
      margin-top: 10px;
      padding-top: 9px;

      border-top:
        1px dashed #eee6ff;

      color: #817687;

      font-size: 11px;

      line-height: 1.6;

      word-break: break-word;
    }

    .note-label {
      color: #a58b98;
      font-weight: 600;
    }


    /* =====================================================
       搜尋後的人員模式
    ===================================================== */

    .person-search-group {
      width: 100%;
      margin-bottom: 20px;
    }

    .person-search-header {
      display: flex;

      align-items: center;
      justify-content: space-between;

      gap: 12px;

      margin-bottom: 10px;
      padding: 14px 17px;

      background: #eee6ff;

      border:
        1px solid #d9c8ff;

      border-radius: 17px;
    }

    .person-search-name {
      color: #59349e;

      font-size: 19px;
      font-weight: 700;

      word-break: break-word;
    }

    .person-search-count {
      flex-shrink: 0;

      color: #89779d;

      font-size: 12px;
    }


    /*
      搜尋時人名已經放上面，
      所以每筆橫卡第一欄改放團務序號
    */

    .search-order-number {
      color: #9b8da6;

      font-size: 12px;
      font-weight: 600;
    }


    /* =====================================================
       無資料
    ===================================================== */

    .empty-box {
      width: 100%;

      padding: 45px 20px;

      color: #9a8da7;

      text-align: center;

      background: #ffffff;

      border:
        1px solid #eee6ff;

      border-radius: 22px;
    }


    /* =====================================================
       平板
    ===================================================== */

    @media (max-width: 1000px) {

      .order-row {
        grid-template-columns:
          120px
          minmax(160px, 1.2fr)
          85px
          minmax(145px, 1fr)
          minmax(145px, 1fr);

        align-items: start;
      }

      .status-column {
        grid-column: 1 / -1;
      }

      .status-selects {
        grid-template-columns:
          repeat(2, minmax(0, 1fr));
      }

    }


    /* =====================================================
       手機
    ===================================================== */

    @media (max-width: 650px) {

      body {
        padding:
          23px 12px 50px;
      }

      h1 {
        font-size: 25px;
      }

      .card {
        border-radius: 21px;
      }

      .summary-card {
        padding: 17px;
      }


      /* 分類 */

      .admin-filter-card {
        padding: 20px 18px;
      }

      .admin-filter-title {
        font-size: 16px;
      }

      .admin-filter-buttons {
        gap: 8px;
      }

      .filter-button {
        min-width: 0;

        padding: 8px 16px;

        font-size: 14px;
      }

      .admin-search-input {
        height: 48px;
        font-size: 14px;
      }


      /* 橫卡手機版 */

      .submission-card {
        padding: 13px;

        border-radius: 18px;
      }

      .order-row {
        display: grid;

        grid-template-columns:
          minmax(0, 1fr)
          auto;

        gap: 8px;
      }


      /* 人名 */

      .order-person {
        grid-column: 1;
      }

      .person-name {
        font-size: 15px;
      }


      /* 金額放右上 */

      .order-amount {
        grid-column: 2;
        grid-row: 1;

        text-align: right;
      }

      .amount-label {
        display: none;
      }

      .amount-value {
        font-size: 14px;
      }


      /* 團務佔整排 */

      .order-activity {
        grid-column: 1 / -1;

        padding-bottom: 8px;

        border-bottom:
          1px dashed #eee6ff;
      }

      .activity-name {
        font-size: 13px;
      }


      /* 匯款資料 */

      .payment-summary {
        grid-column: 1 / -1;
      }


      /* 商品 */

      .products-summary {
        grid-column: 1 / -1;
      }


      /* 狀態 */

      .status-column {
        grid-column: 1 / -1;
      }

      .status-selects {
        grid-template-columns:
          repeat(2, minmax(0, 1fr));
      }

      .status-box select {
        font-size: 12px;
      }


      /* 搜尋模式 */

      .person-search-header {
        padding: 12px 14px;
      }

      .person-search-name {
        font-size: 17px;
      }

      .person-search-count {
        font-size: 11px;
      }

      .search-order-number {
        font-size: 11px;
      }

    }


    @media (max-width: 360px) {

      body {
        padding-left: 8px;
        padding-right: 8px;
      }

      .submission-card {
        padding: 11px;
      }

      .filter-button {
        padding:
          8px 13px;
      }

    }

  </style>

</head>


<body>


<div class="container">


  <!-- =====================================================
       登入
  ====================================================== -->

  <section id="loginPage">

    <h1>
      狐狸🦊
    </h1>

    <div class="subtitle">
      管理員後台
    </div>


    <div class="card login-card">

      <div class="login-icon">
        🦊
      </div>

      <div class="login-title">
        管理員登入
      </div>


      <form id="loginForm">

        <label for="adminPassword">
          管理員密碼
        </label>


        <input
          id="adminPassword"
          type="password"
          placeholder="請輸入管理員密碼"
          autocomplete="off"
          required
        >


        <button
          class="login-button"
          id="loginButton"
          type="submit"
        >
          登入
        </button>


        <div
          class="error-text"
          id="loginError"
        ></div>

      </form>

    </div>

  </section>


  <!-- =====================================================
       管理頁
  ====================================================== -->

  <section id="adminPage">


    <h1>
      狐狸🦊
    </h1>

    <div class="subtitle">
      匯款管理後台
    </div>


    <!-- 上方操作 -->

    <div class="top-actions">

      <button
        type="button"
        class="small-button"
        id="refreshButton"
      >
        ↻ 重新整理
      </button>


      <button
        type="button"
        class="small-button"
        id="logoutButton"
      >
        登出
      </button>

    </div>


    <!-- 筆數 -->

    <div class="card summary-card">

      <div>

        <div class="summary-label">
          目前顯示
        </div>

        <div>
          對帳資料
        </div>

      </div>


      <div
        class="summary-number"
        id="submissionCount"
      >
        0
      </div>

    </div>


    <!-- =================================================
         分類
    ================================================= -->

    <div class="card admin-filter-card">


      <!-- 團務分類 -->

      <div class="admin-filter-section">

        <div class="admin-filter-title">
          依團務分類
        </div>


        <div class="admin-filter-buttons">

          <button
            type="button"
            class="filter-button selected"
            data-type-filter="all"
          >
            全部
          </button>


          <button
            type="button"
            class="filter-button"
            data-type-filter="代購"
          >
            代購
          </button>


          <button
            type="button"
            class="filter-button"
            data-type-filter="單特典"
          >
            單特典
          </button>

        </div>

      </div>


      <!-- 團體 -->

      <div class="admin-filter-section">

        <div class="admin-filter-title">
          依團體
        </div>


        <div class="admin-filter-buttons">

          <button
            type="button"
            class="filter-button selected"
            data-group-filter="all"
          >
            全部
          </button>


          <button
            type="button"
            class="filter-button"
            data-group-filter="TWS"
          >
            TWS
          </button>


          <button
            type="button"
            class="filter-button"
            data-group-filter="Stray Kids"
          >
            Stray Kids
          </button>

        </div>

      </div>


      <!-- 名稱搜尋 -->

      <div class="admin-filter-section">

        <div class="admin-filter-title">
          依名稱搜尋
        </div>


        <input
          id="searchInput"
          class="admin-search-input"
          type="search"
          placeholder="輸入 Facebook 名稱"
          autocomplete="off"
        >

      </div>


    </div>


    <!-- 資料 -->

    <div id="submissionList">

      <div class="empty-box">
        讀取資料中… 🦊
      </div>

    </div>


  </section>


</div>


<script>


/* =====================================================
   Worker
===================================================== */

const WORKER_URL =
  "https://fox-form-api.a0983707826.workers.dev";


/* =====================================================
   狀態
===================================================== */

let adminPassword =
  "";

let submissions =
  [];

let currentTypeFilter =
  "all";

let currentGroupFilter =
  "all";


/* =====================================================
   DOM
===================================================== */

const loginPage =
  document.getElementById(
    "loginPage"
  );

const adminPage =
  document.getElementById(
    "adminPage"
  );

const loginForm =
  document.getElementById(
    "loginForm"
  );

const passwordInput =
  document.getElementById(
    "adminPassword"
  );

const loginButton =
  document.getElementById(
    "loginButton"
  );

const loginError =
  document.getElementById(
    "loginError"
  );

const submissionList =
  document.getElementById(
    "submissionList"
  );

const submissionCount =
  document.getElementById(
    "submissionCount"
  );

const refreshButton =
  document.getElementById(
    "refreshButton"
  );

const logoutButton =
  document.getElementById(
    "logoutButton"
  );

const searchInput =
  document.getElementById(
    "searchInput"
  );


/* =====================================================
   HTML 安全
===================================================== */

function escapeHTML(value) {

  return String(
    value ?? ""
  )
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/* =====================================================
   金額
===================================================== */

function formatMoney(value) {

  const number =
    Number(
      value || 0
    );


  return (
    "NT$ " +
    number.toLocaleString(
      "zh-TW"
    )
  );

}


/* =====================================================
   日期
===================================================== */

function formatDate(value) {

  if (!value) {
    return "—";
  }


  const date =
    new Date(value);


  if (
    Number.isNaN(
      date.getTime()
    )
  ) {

    return String(value);

  }


  return new Intl.DateTimeFormat(
    "zh-TW",
    {

      timeZone:
        "Asia/Taipei",

      year:
        "numeric",

      month:
        "2-digit",

      day:
        "2-digit",

      hour:
        "2-digit",

      minute:
        "2-digit"

    }
  ).format(date);

}


/* =====================================================
   下拉選項
===================================================== */

function createOptions(
  options,
  selected
) {

  return options
    .map(
      option => {

        const isSelected =
          option === selected
            ? "selected"
            : "";


        return `

          <option
            value="${escapeHTML(option)}"
            ${isSelected}
          >
            ${escapeHTML(option)}
          </option>

        `;

      }
    )
    .join("");

}


/* =====================================================
   登入
===================================================== */

loginForm.addEventListener(
  "submit",
  async event => {

    event.preventDefault();


    loginError.textContent =
      "";


    adminPassword =
      passwordInput
        .value
        .trim();


    if (!adminPassword) {

      loginError.textContent =
        "請輸入管理員密碼";

      return;

    }


    loginButton.disabled =
      true;


    loginButton.textContent =
      "登入中…";


    const success =
      await loadSubmissions(
        true
      );


    if (success) {

      loginPage.style.display =
        "none";


      adminPage.style.display =
        "block";


      passwordInput.value =
        "";


      window.scrollTo(
        0,
        0
      );

    }


    loginButton.disabled =
      false;


    loginButton.textContent =
      "登入";

  }
);


/* =====================================================
   讀資料
===================================================== */

async function loadSubmissions(
  isLogin = false
) {

  try {

    const response =
      await fetch(
        WORKER_URL +
        "/admin/list",
        {

          method:
            "POST",

          headers: {

            "Content-Type":
              "application/json",

            "X-Admin-Password":
              adminPassword

          },

          body:
            JSON.stringify({})

        }
      );


    let result;


    try {

      result =
        await response.json();

    }

    catch {

      throw new Error(
        "後台回傳格式錯誤"
      );

    }


    if (
      !response.ok ||
      !result.success
    ) {

      if (
        response.status === 401
      ) {

        loginError.textContent =
          "管理員密碼錯誤";


        adminPassword =
          "";

      }

      else if (
        isLogin
      ) {

        loginError.textContent =
          result.message ||
          "登入失敗";

      }

      else {

        alert(
          result.message ||
          "讀取資料失敗"
        );

      }


      return false;

    }


    submissions =
      Array.isArray(
        result.submissions
      )
        ? result.submissions
        : [];


    renderSubmissions();


    return true;

  }

  catch(error) {

    console.error(error);


    if (
      isLogin
    ) {

      loginError.textContent =
        "無法連線到後台";

    }

    else {

      alert(
        "目前無法讀取資料"
      );

    }


    return false;

  }

}


/* =====================================================
   商品 HTML
===================================================== */

function createProductsHTML(
  item
) {

  const products =
    Array.isArray(
      item.products
    )
      ? item.products
      : [];


  if (
    !products.length
  ) {

    return `

      <div class="product-line">
        無商品資料
      </div>

    `;

  }


  return products
    .map(
      product => {

        let name =
          product.name ||
          product.productName ||
          "商品";


        if (
          product.variant &&
          !name.includes(
            product.variant
          )
        ) {

          name +=
            `｜${product.variant}`;

        }


        return `

          <div class="product-line">
            ${escapeHTML(name)}
          </div>

        `;

      }
    )
    .join("");

}


/* =====================================================
   建立橫向訂單
===================================================== */

function createSubmissionCard(
  item,
  realIndex,
  options = {}
) {

  const hidePersonName =
    options.hidePersonName ===
      true;


  const orderNumber =
    options.orderNumber ||
    "";


  const paymentStatus =
    item.paymentStatus ||
    "待對帳";


  const progress =
    item.progress ||
    "已登記";


  const groupType =
    item.groupType ||
    "未分類";


  const typeClass =
    groupType ===
      "單特典"

      ? "special"

      : "";


  const activity =
    item.activity ||
    item.community ||
    "未填團務";


  const productsHTML =
    createProductsHTML(
      item
    );


  const paymentOptions = [
    "待對帳",
    "已匯款",
    "需確認"
  ];


  const progressOptions = [
    "已登記",
    "已下單",
    "已到貨",
    "已寄出",
    "已完成"
  ];


  return `

    <article
      class="submission-card"
      data-index="${realIndex}"
    >


      <div class="order-row">


        <!-- 名稱 -->

        <div class="order-person">

          ${
            hidePersonName

              ? `

                  <div class="search-order-number">
                    團務 ${orderNumber}
                  </div>

                `

              : `

                  <div class="person-name">
                    ${escapeHTML(
                      item.facebookName ||
                      "未填名稱"
                    )}
                  </div>

                `
          }


          <div class="submitted-time">

            送出：
            ${escapeHTML(
              formatDate(
                item.submittedAt ||
                item.createdAt ||
                item.timestamp
              )
            )}

          </div>

        </div>


        <!-- 團務 -->

        <div class="order-activity">

          <div class="activity-name">
            ${escapeHTML(activity)}
          </div>


          <div class="activity-meta">

            <span
              class="
                type-pill
                ${typeClass}
              "
            >
              ${escapeHTML(groupType)}
            </span>


            ${
              item.group

                ? `

                    <span class="group-pill">
                      ${escapeHTML(
                        item.group
                      )}
                    </span>

                  `

                : ""
            }

          </div>

        </div>


        <!-- 金額 -->

        <div class="order-amount">

          <div class="amount-label">
            匯款金額
          </div>

          <div class="amount-value">

            ${formatMoney(
              item.paymentAmount
            )}

          </div>

        </div>


        <!-- 匯款 -->

        <div class="payment-summary">

          <div class="mini-title">
            匯款資料
          </div>


          <div class="mini-value">

            ${escapeHTML(
              item.paymentBank ||
              "—"
            )}

            ｜

            ${escapeHTML(
              item.accountLastFive ||
              "—"
            )}

          </div>


          <div class="mini-value">

            ${escapeHTML(
              item.paymentDate ||
              "—"
            )}

            ${
              item.paymentTime

                ? " " +
                  escapeHTML(
                    item.paymentTime
                  )

                : ""
            }

          </div>

        </div>


        <!-- 商品 -->

        <div class="products-summary">

          <div class="mini-title">
            商品
          </div>

          ${productsHTML}

        </div>


        <!-- 狀態 -->

        <div class="status-column">


          <div class="status-selects">


            <div class="status-box">

              <label>
                匯款狀態
              </label>

              <select
                class="payment-status"
              >

                ${createOptions(
                  paymentOptions,
                  paymentStatus
                )}

              </select>

            </div>


            <div class="status-box">

              <label>
                團務進度
              </label>

              <select
                class="progress-status"
              >

                ${createOptions(
                  progressOptions,
                  progress
                )}

              </select>

            </div>


          </div>


          <button
            type="button"
            class="save-button"
            data-index="${realIndex}"
          >
            儲存狀態
          </button>


        </div>


      </div>


      ${
        item.note

          ? `

              <div class="note-row">

                <span class="note-label">
                  備註：
                </span>

                ${escapeHTML(
                  item.note
                )}

              </div>

            `

          : ""
      }


    </article>

  `;

}


/* =====================================================
   篩選 + 顯示
===================================================== */

function renderSubmissions() {

  const keyword =
    searchInput
      .value
      .trim()
      .toLowerCase();


  const filtered =
    submissions.filter(
      item => {


        /* 團務分類 */

        const itemType =
          String(
            item.groupType ||
            ""
          );


        const matchesType =
          currentTypeFilter ===
            "all"
          ||
          itemType ===
            currentTypeFilter;


        /* 團體 */

        const itemGroup =
          String(
            item.group ||
            ""
          );


        const matchesGroup =
          currentGroupFilter ===
            "all"
          ||
          itemGroup ===
            currentGroupFilter;


        /* Facebook 名稱 */

        const facebookName =
          String(
            item.facebookName ||
            ""
          )
            .trim()
            .toLowerCase();


        const matchesName =
          !keyword ||
          facebookName.includes(
            keyword
          );


        return (
          matchesType &&
          matchesGroup &&
          matchesName
        );

      }
    );


  submissionCount.textContent =
    filtered.length;


  if (
    !filtered.length
  ) {

    submissionList.innerHTML = `

      <div class="empty-box">
        目前沒有符合的對帳資料 🦊
      </div>

    `;


    return;

  }


  /* ===================================================
     沒有搜尋
     → 一筆一條橫向
  =================================================== */

  if (
    !keyword
  ) {

    submissionList.innerHTML =
      filtered
        .map(
          item => {

            const realIndex =
              submissions.indexOf(
                item
              );


            return createSubmissionCard(
              item,
              realIndex
            );

          }
        )
        .join("");


    return;

  }


  /* ===================================================
     有搜尋
     → 同一名稱只顯示一次
  =================================================== */

  const people =
    {};


  filtered.forEach(
    item => {

      const name =
        String(
          item.facebookName ||
          "未填名稱"
        )
          .trim();


      if (
        !people[name]
      ) {

        people[name] =
          [];

      }


      people[name].push(
        item
      );

    }
  );


  submissionList.innerHTML =
    Object
      .entries(
        people
      )
      .map(
        ([name, items]) => {


          const rowsHTML =
            items
              .map(
                (item, index) => {

                  const realIndex =
                    submissions.indexOf(
                      item
                    );


                  return createSubmissionCard(
                    item,
                    realIndex,
                    {

                      hidePersonName:
                        true,

                      orderNumber:
                        index + 1

                    }
                  );

                }
              )
              .join("");


          return `

            <section class="person-search-group">


              <div class="person-search-header">


                <div class="person-search-name">

                  ${escapeHTML(name)}

                </div>


                <div class="person-search-count">

                  共參加
                  ${items.length}
                  筆團務

                </div>


              </div>


              ${rowsHTML}


            </section>

          `;

        }
      )
      .join("");

}


/* =====================================================
   團務分類
===================================================== */

document
  .querySelectorAll(
    "[data-type-filter]"
  )
  .forEach(
    button => {

      button.addEventListener(
        "click",
        () => {

          currentTypeFilter =
            button.dataset.typeFilter;


          document
            .querySelectorAll(
              "[data-type-filter]"
            )
            .forEach(
              item => {

                item.classList.remove(
                  "selected"
                );

              }
            );


          button.classList.add(
            "selected"
          );


          renderSubmissions();

        }
      );

    }
  );


/* =====================================================
   團體
===================================================== */

document
  .querySelectorAll(
    "[data-group-filter]"
  )
  .forEach(
    button => {

      button.addEventListener(
        "click",
        () => {

          currentGroupFilter =
            button.dataset.groupFilter;


          document
            .querySelectorAll(
              "[data-group-filter]"
            )
            .forEach(
              item => {

                item.classList.remove(
                  "selected"
                );

              }
            );


          button.classList.add(
            "selected"
          );


          renderSubmissions();

        }
      );

    }
  );


/* =====================================================
   名稱搜尋
===================================================== */

searchInput.addEventListener(
  "input",
  renderSubmissions
);


/* =====================================================
   儲存狀態
===================================================== */

submissionList.addEventListener(
  "click",
  async event => {

    const button =
      event.target.closest(
        ".save-button"
      );


    if (!button) {
      return;
    }


    const index =
      Number(
        button.dataset.index
      );


    const item =
      submissions[index];


    if (!item) {
      return;
    }


    if (
      !item._path
    ) {

      alert(
        "找不到這筆資料的路徑，無法更新。"
      );

      return;

    }


    const card =
      button.closest(
        ".submission-card"
      );


    const paymentStatus =
      card
        .querySelector(
          ".payment-status"
        )
        .value;


    const progress =
      card
        .querySelector(
          ".progress-status"
        )
        .value;


    button.disabled =
      true;


    button.classList.remove(
      "saved"
    );


    button.textContent =
      "儲存中…";


    try {

      const response =
        await fetch(
          WORKER_URL +
          "/admin/update",
          {

            method:
              "POST",

            headers: {

              "Content-Type":
                "application/json",

              "X-Admin-Password":
                adminPassword

            },

            body:
              JSON.stringify({

                path:
                  item._path,

                paymentStatus,

                progress

              })

          }
        );


      let result;


      try {

        result =
          await response.json();

      }

      catch {

        throw new Error(
          "後台回傳格式錯誤"
        );

      }


      if (
        !response.ok ||
        !result.success
      ) {

        if (
          response.status ===
            401
        ) {

          alert(
            "管理員登入已失效，請重新登入。"
          );


          logoutAdmin();


          return;

        }


        alert(
          result.message ||
          "更新失敗"
        );


        button.textContent =
          "儲存狀態";


        return;

      }


      submissions[index] = {

        ...item,

        paymentStatus,

        progress

      };


      button.classList.add(
        "saved"
      );


      button.textContent =
        "✓ 已儲存";


      setTimeout(
        () => {

          button.classList.remove(
            "saved"
          );


          button.textContent =
            "儲存狀態";

        },

        1200
      );

    }

    catch(error) {

      console.error(error);


      alert(
        "目前無法更新資料"
      );


      button.textContent =
        "儲存狀態";

    }

    finally {

      button.disabled =
        false;

    }

  }
);


/* =====================================================
   重新整理
===================================================== */

refreshButton.addEventListener(
  "click",
  async () => {

    refreshButton.disabled =
      true;


    refreshButton.textContent =
      "讀取中…";


    await loadSubmissions();


    refreshButton.disabled =
      false;


    refreshButton.textContent =
      "↻ 重新整理";

  }
);


/* =====================================================
   登出
===================================================== */

function logoutAdmin() {

  adminPassword =
    "";


  submissions =
    [];


  currentTypeFilter =
    "all";


  currentGroupFilter =
    "all";


  searchInput.value =
    "";


  submissionCount.textContent =
    "0";


  submissionList.innerHTML =
    "";


  document
    .querySelectorAll(
      "[data-type-filter]"
    )
    .forEach(
      button => {

        button.classList.toggle(

          "selected",

          button.dataset.typeFilter ===
            "all"

        );

      }
    );


  document
    .querySelectorAll(
      "[data-group-filter]"
    )
    .forEach(
      button => {

        button.classList.toggle(

          "selected",

          button.dataset.groupFilter ===
            "all"

        );

      }
    );


  adminPage.style.display =
    "none";


  loginPage.style.display =
    "block";


  loginError.textContent =
    "";


  passwordInput.value =
    "";


  window.scrollTo(
    0,
    0
  );


  passwordInput.focus();

}


logoutButton.addEventListener(
  "click",
  logoutAdmin
);


</script>
