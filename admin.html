<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="format-detection" content="telephone=no">
  <title>狐狸🦊管理後台</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      padding: 28px 16px 50px;
      background: #faf8ff;
      color: #4f4660;
      font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .page-shell {
      width: 100%;
      max-width: 1180px;
      margin: 0 auto;
    }

    h1 {
      margin-bottom: 24px;
      color: #6b46c1;
      font-size: 28px;
      text-align: center;
    }

    .card {
      margin-bottom: 16px;
      padding: 18px;
      background: #ffffff;
      border: 1px solid #eee6ff;
      border-radius: 20px;
      box-shadow: 0 5px 16px rgba(116, 82, 165, 0.08);
    }

    .login-card {
      max-width: 430px;
      margin: 60px auto 0;
    }

    .login-title {
      margin-bottom: 15px;
      color: #59349e;
      font-size: 20px;
      font-weight: 700;
      text-align: center;
    }

    input,
    select {
      width: 100%;
      padding: 11px 13px;
      background: #ffffff;
      color: #4f4660;
      border: 1.5px solid #d9c8ff;
      border-radius: 13px;
      outline: none;
    }

    input:focus,
    select:focus {
      border-color: #9f7aea;
      box-shadow: 0 0 0 3px rgba(159, 122, 234, 0.12);
    }

    .primary-button,
    .secondary-button,
    .save-button,
    .delete-button {
      border: none;
      border-radius: 999px;
      font-weight: 700;
    }

    .primary-button {
      width: 100%;
      margin-top: 12px;
      padding: 11px 16px;
      background: #cbb8f5;
      color: #4c2e83;
    }

    .secondary-button {
      padding: 9px 15px;
      background: #ffffff;
      color: #6842b3;
      border: 1.5px solid #d9c8ff;
    }

    #adminArea {
      display: none;
    }

    .top-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }

    .top-button-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .summary-text {
      color: #7d6d8c;
      font-size: 14px;
    }

    .filter-title {
      margin-bottom: 8px;
      color: #6b46c1;
      font-size: 15px;
      font-weight: 700;
    }

    .filter-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }

    .filter-block {
      min-width: 0;
    }

    .filter-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }

    .filter-button {
      padding: 7px 12px;
      background: #ffffff;
      color: #6842b3;
      border: 1.5px solid #d9c8ff;
      border-radius: 999px;
    }

    .filter-button.selected {
      background: #dccfff;
      border-color: #b99bf5;
      color: #59349e;
    }

    .empty-message,
    .loading-message {
      padding: 25px;
      color: #8b8295;
      text-align: center;
    }

    .person-group {
      margin-bottom: 22px;
    }

    .person-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
      padding: 13px 17px;
      background: #eee6ff;
      border-radius: 17px;
    }

    .person-name {
      color: #59349e;
      font-size: 19px;
      font-weight: 800;
    }

    .person-count {
      color: #837493;
      font-size: 13px;
    }

    .submission-card {
      overflow: hidden;
      margin-bottom: 14px;
      padding: 0;
    }

    .submission-main {
      padding: 18px;
    }

    .submission-section {
      min-width: 0;
    }

    .small-label {
      margin-bottom: 5px;
      color: #988ba5;
      font-size: 12px;
      font-weight: 700;
    }

    .main-name {
      color: #4f4660;
      font-size: 19px;
      font-weight: 800;
      word-break: break-word;
    }

    .activity-name {
      color: #6842b3;
      font-size: 15px;
      font-weight: 700;
      line-height: 1.5;
      word-break: break-word;
    }

    .order-heading-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-top: 15px;
    }

    .order-amount {
      flex-shrink: 0;
      color: #6842b3;
      font-size: 16px;
      font-weight: 800;
      white-space: nowrap;
    }

    .meta-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 9px;
    }

    .meta-pill {
      padding: 4px 8px;
      background: #f1eaff;
      color: #6842b3;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
    }

    .meta-pill.stock {
      background: #e4f5e8;
      color: #287747;
    }

    .product-list {
      margin-top: 9px;
      padding: 11px 13px;
      background: #faf8ff;
      border: 1px solid #eee6ff;
      border-radius: 12px;
    }

    .source-title {
      margin-top: 9px;
      color: #654f80;
      font-size: 13px;
      font-weight: 800;
    }

    .source-title:first-child {
      margin-top: 0;
    }

    .product-line {
      margin-top: 4px;
      color: #675b72;
      font-size: 14px;
      line-height: 1.5;
      word-break: break-word;
    }

    .payment-inline {
      overflow-x: auto;
      margin-top: 5px;
      padding: 10px 12px;
      background: #faf8ff;
      border: 1px solid #eee6ff;
      border-radius: 12px;
    }

    .payment-inline-value {
      color: #62576d;
      font-size: 13px;
      line-height: 1.6;
      word-break: break-word;
    }

    .payment-detail-line + .payment-detail-line {
      margin-top: 3px;
    }

    .note-box {
      margin-top: 8px;
      padding: 9px 11px;
      background: #fff9ea;
      color: #79632d;
      border-radius: 11px;
      font-size: 13px;
      line-height: 1.5;
      word-break: break-word;
    }

    .status-grid {
      display: grid;
      gap: 9px;
      margin-top: 14px;
    }

    .status-label {
      color: #837493;
      font-size: 12px;
      font-weight: 700;
    }

    .status-label select {
      margin-top: 5px;
    }

    .submission-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 9px;
      padding: 12px 18px 16px;
      background: #fcfaff;
      border-top: 1px solid #eee6ff;
    }

    .save-button,
    .delete-button {
      padding: 9px 16px;
    }

    .save-button {
      background: #cbb8f5;
      color: #4c2e83;
    }

    .delete-button {
      background: #fff0f0;
      color: #aa4141;
      border: 1px solid #f0caca;
    }

    .delete-button.stock-delete {
      background: #fff4e7;
      color: #a45c1c;
      border-color: #efd1ad;
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    @media (max-width: 850px) {
      .filter-grid {
        grid-template-columns: 1fr;
      }

      .submission-main {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 520px) {
      body {
        padding: 22px 12px 40px;
      }

      h1 {
        font-size: 24px;
      }

      .top-actions,
      .person-header {
        align-items: flex-start;
        flex-direction: column;
      }

      .submission-actions {
        justify-content: stretch;
      }

      .save-button,
      .delete-button {
        flex: 1;
      }
    }
  </style>
</head>

<body>
  <div class="page-shell">
    <h1>狐狸🦊管理後台</h1>

    <section id="loginArea" class="card login-card">
      <div class="login-title">管理員登入</div>
      <input id="passwordInput" type="password" placeholder="請輸入管理員密碼" autocomplete="current-password">
      <button id="loginButton" type="button" class="primary-button">登入</button>
    </section>

    <section id="adminArea">
      <div class="top-actions">
        <div id="summaryText" class="summary-text">目前共 0 筆資料</div>

        <div class="top-button-group">
          <button id="refreshButton" type="button" class="secondary-button">重新整理</button>
          <button id="logoutButton" type="button" class="secondary-button">登出</button>
        </div>
      </div>

      <div class="card">
        <div class="filter-grid">
          <div class="filter-block">
            <div class="filter-title">依團務分類</div>
            <div id="typeFilters" class="filter-buttons">
              <button type="button" class="filter-button selected" data-filter="all">全部</button>
              <button type="button" class="filter-button" data-filter="代購">代購</button>
              <button type="button" class="filter-button" data-filter="單特典">單特典</button>
              <button type="button" class="filter-button" data-filter="現貨">現貨</button>
            </div>
          </div>

          <div class="filter-block">
            <div class="filter-title">依團體</div>
            <div id="groupFilters" class="filter-buttons">
              <button type="button" class="filter-button selected" data-filter="all">全部</button>
              <button type="button" class="filter-button" data-filter="TWS">TWS</button>
              <button type="button" class="filter-button" data-filter="Stray Kids">Stray Kids</button>
            </div>
          </div>

          <div class="filter-block">
            <div class="filter-title">依名稱搜尋</div>
            <input id="nameSearch" type="search" placeholder="輸入 Facebook 名稱" autocomplete="off">
          </div>
        </div>
      </div>

      <div id="submissionList"></div>
    </section>
  </div>

  <script>
    const WORKER_URL = "https://fox-form-api.a0983707826.workers.dev";
    const COMBINED_STOCK_GROUP_ID = "in-stock-combined";
    const COMBINED_OSAKA_GROUP_ID = "osaka-combined";
    const COMBINED_SODA_GROUP_ID = "soda-soda-winter";

    const alwaysStockGroups = new Set([
      "run-it-japan-kuji"
    ]);

    const stockManagedGroups = new Set([
      "run-it-japan-kuji",
      "nagoya-0905",
      "osaka-0919",
      "osaka-0920",
      "fans-luck-draw-and-ver",
      COMBINED_STOCK_GROUP_ID,
      COMBINED_OSAKA_GROUP_ID,
      COMBINED_SODA_GROUP_ID
    ]);

    let adminPassword = "";
    let submissions = [];
    let currentTypeFilter = "all";
    let currentGroupFilter = "all";

    const loginArea = document.getElementById("loginArea");
    const adminArea = document.getElementById("adminArea");
    const passwordInput = document.getElementById("passwordInput");
    const loginButton = document.getElementById("loginButton");
    const refreshButton = document.getElementById("refreshButton");
    const logoutButton = document.getElementById("logoutButton");
    const submissionList = document.getElementById("submissionList");
    const summaryText = document.getElementById("summaryText");
    const nameSearch = document.getElementById("nameSearch");

    function escapeHTML(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function formatMoney(value) {
      const number = Number(value || 0);
      return `NT$${number.toLocaleString("zh-TW")}`;
    }

    function formatCreatedAt(value) {
      if (!value) return "";
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return String(value);

      return new Intl.DateTimeFormat("zh-TW", {
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit",
        hour12: false
      }).format(date);
    }

    function getTypeClass(groupType) {
      return groupType === "現貨" ? "stock" : "";
    }

    function normalizeAdminSubmission(item) {
      const groupId = String(item?.groupId || "").trim();

      if (
        groupId === COMBINED_STOCK_GROUP_ID
        || alwaysStockGroups.has(groupId)
      ) {
        return {
          ...item,
          groupType: "現貨"
        };
      }

      return item;
    }

    function getAdminProductHTML(item) {
      const products = Array.isArray(item.products) ? item.products : [];

      if (!products.length) {
        return `<div class="product-line">沒有商品資料</div>`;
      }

      if (
        item.groupId === COMBINED_STOCK_GROUP_ID
        || item.groupType === "現貨"
        || products.some(product => String(product.sourceActivity || "").trim())
      ) {
        let lastSource = "";

        return products.map(product => {
          const source = String(product.sourceActivity || "現貨").trim();
          const productName = String(product.productName || "商品").trim();
          const variant = String(product.variant || "").trim();
          const quantity = Math.max(1, Number(product.quantity || 1));
          const price = Number(product.price || product.unitPrice * quantity || 0);

          let text = productName;
          if (variant) text += `｜${variant}`;
          text += ` ×${quantity}`;
          if (price > 0) text += `・${formatMoney(price)}`;

          const sourceHTML = source && source !== lastSource
            ? `<div class="source-title">${escapeHTML(source)}</div>`
            : "";

          lastSource = source;
          return `${sourceHTML}<div class="product-line">${escapeHTML(text)}</div>`;
        }).join("");
      }

      return products.map(product => {
        const productName = String(product.productName || "").trim();
        const variant = String(product.variant || "").trim();
        const quantity = Math.max(1, Number(product.quantity || 1));
        const price = Number(product.price || product.unitPrice * quantity || 0);

        let text = "";

        if (productName) {
          text = productName;
          if (variant) text += `｜${variant}`;
          text += ` ×${quantity}`;
        } else {
          text = String(product.name || "商品");
        }

        if (price > 0) text += `・${formatMoney(price)}`;

        return `<div class="product-line">${escapeHTML(text)}</div>`;
      }).join("");
    }

    function renderSubmissionCard(item, realIndex) {
      const stockManaged = stockManagedGroups.has(item.groupId);
      const paymentStatus = item.paymentStatus || "待對帳";
      const progress = item.progress || "已登記";
      const activity = item.activity || item.community || "團務";
      const groupType = item.groupType || "";
      const group = item.group || "";
      const note = String(item.note || "").trim();

      return `
        <article class="card submission-card" data-card-index="${realIndex}">
          <div class="submission-main">
            <div class="submission-section">
              <div class="small-label">Facebook 名稱</div>
              <div class="main-name">${escapeHTML(item.facebookName || "未填名稱")}</div>

              <div class="meta-pills">
                ${groupType ? `<span class="meta-pill ${getTypeClass(groupType)}">${escapeHTML(groupType)}</span>` : ""}
                ${group ? `<span class="meta-pill">${escapeHTML(group)}</span>` : ""}
              </div>

              <div class="order-heading-row">
                <div class="activity-name">${escapeHTML(activity)}</div>
                <div class="order-amount">${escapeHTML(formatMoney(item.paymentAmount || 0))}</div>
              </div>

              <div class="product-list">${getAdminProductHTML(item)}</div>

              <div class="small-label" style="margin-top:13px;">匯款資料</div>
              <div class="payment-inline">
                <div class="payment-inline-value payment-detail-line">
                  ${escapeHTML(item.paymentBank || "未填銀行")}｜${escapeHTML(item.accountLastFive || "-")}
                </div>
                <div class="payment-inline-value payment-detail-line">
                  ${escapeHTML(item.paymentDate || "-")}｜${escapeHTML(item.paymentTime || "-")}
                </div>
              </div>

              ${note ? `<div class="note-box">備註：${escapeHTML(note)}</div>` : ""}

              <div class="status-grid">
                <label class="status-label">
                  對帳狀態
                  <select class="payment-status-select" data-index="${realIndex}">
                    <option value="待對帳" ${paymentStatus === "待對帳" ? "selected" : ""}>待對帳</option>
                    <option value="已匯款" ${paymentStatus === "已匯款" ? "selected" : ""}>已匯款</option>
                    <option value="需確認" ${paymentStatus === "需確認" ? "selected" : ""}>需確認</option>
                  </select>
                </label>

                <label class="status-label">
                  團務進度
                  <select class="progress-select" data-index="${realIndex}">
                    <option value="已登記" ${progress === "已登記" ? "selected" : ""}>已登記</option>
                    <option value="已下單" ${progress === "已下單" ? "selected" : ""}>已下單</option>
                    <option value="已到貨" ${progress === "已到貨" ? "selected" : ""}>已到貨</option>
                    <option value="已寄出" ${progress === "已寄出" ? "selected" : ""}>已寄出</option>
                    <option value="已完成" ${progress === "已完成" ? "selected" : ""}>已完成</option>
                  </select>
                </label>
              </div>
            </div>
          </div>

          <div class="submission-actions">
            <button type="button" class="save-button" data-save-index="${realIndex}">儲存進度</button>
            <button
              type="button"
              class="delete-button ${stockManaged ? "stock-delete" : ""}"
              data-delete-index="${realIndex}"
            >
              刪除並恢復庫存
            </button>
          </div>
        </article>
      `;
    }

    function getFilteredSubmissions() {
      const searchText = nameSearch.value.trim().toLowerCase();

      return submissions
        .map((item, realIndex) => ({ item, realIndex }))
        .filter(({ item }) => {
          const matchesType = currentTypeFilter === "all" || item.groupType === currentTypeFilter;
          const matchesGroup = currentGroupFilter === "all" || item.group === currentGroupFilter;
          const name = String(item.facebookName || "").trim().toLowerCase();
          const matchesSearch = !searchText || name.includes(searchText);

          return matchesType && matchesGroup && matchesSearch;
        });
    }

    function bindRenderedActions() {
      document.querySelectorAll("[data-save-index]").forEach(button => {
        button.addEventListener("click", () => {
          saveSubmission(Number(button.dataset.saveIndex), button);
        });
      });

      document.querySelectorAll("[data-delete-index]").forEach(button => {
        button.addEventListener("click", () => {
          deleteSubmission(Number(button.dataset.deleteIndex), button);
        });
      });
    }

    function renderSubmissions() {
      const filtered = getFilteredSubmissions();
      const searchText = nameSearch.value.trim().toLowerCase();

      summaryText.textContent = `目前共 ${submissions.length} 筆資料・顯示 ${filtered.length} 筆`;

      if (!filtered.length) {
        submissionList.innerHTML = `<div class="card empty-message">目前沒有符合的資料 🦊</div>`;
        return;
      }

      if (!searchText) {
        submissionList.innerHTML = filtered
          .map(({ item, realIndex }) => renderSubmissionCard(item, realIndex))
          .join("");

        bindRenderedActions();
        return;
      }

      const people = {};

      filtered.forEach(entry => {
        const name = String(entry.item.facebookName || "未填名稱").trim();
        if (!people[name]) people[name] = [];
        people[name].push(entry);
      });

      submissionList.innerHTML = Object.entries(people).map(([name, entries]) => `
        <section class="person-group">
          <div class="person-header">
            <div class="person-name">${escapeHTML(name)}</div>
            <div class="person-count">共 ${entries.length} 筆訂單</div>
          </div>

          ${entries.map(({ item, realIndex }) => renderSubmissionCard(item, realIndex)).join("")}
        </section>
      `).join("");

      bindRenderedActions();
    }

    async function loadSubmissions() {
      submissionList.innerHTML = `<div class="card loading-message">讀取後台資料中…</div>`;
      refreshButton.disabled = true;

      try {
        const response = await fetch(WORKER_URL + "/admin/list", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "X-Admin-Password": adminPassword
          }
        });

        const result = await response.json();

        if (!response.ok || !result.success) {
          if (response.status === 401) {
            adminPassword = "";
            adminArea.style.display = "none";
            loginArea.style.display = "block";
            passwordInput.value = "";
          }

          throw new Error(result.message || "讀取失敗");
        }

        submissions = Array.isArray(result.submissions)
          ? result.submissions.map(normalizeAdminSubmission)
          : [];

        renderSubmissions();
      } catch (error) {
        console.error(error);
        submissionList.innerHTML = `<div class="card empty-message">${escapeHTML(error.message || "後台資料讀取失敗")}</div>`;
      } finally {
        refreshButton.disabled = false;
      }
    }

    async function login() {
      const password = passwordInput.value;

      if (!password) {
        alert("請輸入管理員密碼");
        return;
      }

      adminPassword = password;
      loginButton.disabled = true;
      loginButton.textContent = "登入中…";

      try {
        const response = await fetch(WORKER_URL + "/admin/list", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "X-Admin-Password": adminPassword
          }
        });

        const result = await response.json();

        if (!response.ok || !result.success) {
          throw new Error(result.message || "登入失敗");
        }

        submissions = Array.isArray(result.submissions)
          ? result.submissions.map(normalizeAdminSubmission)
          : [];

        passwordInput.value = "";
        loginArea.style.display = "none";
        adminArea.style.display = "block";
        renderSubmissions();
      } catch (error) {
        adminPassword = "";
        alert(error.message || "登入失敗");
      } finally {
        loginButton.disabled = false;
        loginButton.textContent = "登入";
      }
    }

    async function saveSubmission(realIndex, button) {
      const item = submissions[realIndex];
      if (!item) return;

      const card = document.querySelector(`[data-card-index="${realIndex}"]`);
      if (!card) return;

      const paymentStatus = card.querySelector(".payment-status-select")?.value || "待對帳";
      const progress = card.querySelector(".progress-select")?.value || "已登記";

      button.disabled = true;
      const oldText = button.textContent;
      button.textContent = "儲存中…";

      try {
        const response = await fetch(WORKER_URL + "/admin/update", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "X-Admin-Password": adminPassword
          },
          body: JSON.stringify({
            path: item._path,
            paymentStatus,
            progress
          })
        });

        const result = await response.json();

        if (!response.ok || !result.success) {
          throw new Error(result.message || "儲存失敗");
        }

        submissions[realIndex].paymentStatus = paymentStatus;
        submissions[realIndex].progress = progress;
        alert("狀態已儲存");
      } catch (error) {
        alert(error.message || "儲存失敗");
      } finally {
        button.disabled = false;
        button.textContent = oldText;
      }
    }

    async function deleteSubmission(realIndex, button) {
      const item = submissions[realIndex];
      if (!item) return;

      const stockManaged = stockManagedGroups.has(item.groupId);
      const activity = item.activity || item.community || "此團務";
      const facebookName = item.facebookName || "此客人";

      const confirmMessage = stockManaged
        ? (
            `確定要刪除這筆資料嗎？\n\n` +
            `${facebookName}\n` +
            `${activity}\n\n` +
            `此操作會：\n` +
            `1. 刪除這筆對帳資料\n` +
            `2. 自動把這筆訂單涉及的所有現貨商品庫存補回\n\n` +
            `如果這是合併現貨訂單，三個團務的庫存會依實際購買內容分別恢復。\n\n` +
            `確定要繼續嗎？`
          )
        : (
            `確定要刪除這筆資料嗎？\n\n` +
            `${facebookName}\n` +
            `${activity}\n\n` +
            `刪除後將不會出現在後台與公開對帳表。`
          );

      if (!window.confirm(confirmMessage)) return;

      button.disabled = true;
      const oldText = button.textContent;
      button.textContent = stockManaged ? "恢復庫存並刪除中…" : "刪除中…";

      try {
        const response = await fetch(WORKER_URL + "/admin/delete", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "X-Admin-Password": adminPassword
          },
          body: JSON.stringify({
            path: item._path
          })
        });

        const result = await response.json();

        if (!response.ok || !result.success) {
          throw new Error(result.message || "刪除失敗");
        }

        alert(result.message || "資料已刪除");
        await loadSubmissions();
      } catch (error) {
        alert(error.message || "刪除失敗");
        button.disabled = false;
        button.textContent = oldText;
      }
    }

    loginButton.addEventListener("click", login);

    passwordInput.addEventListener("keydown", event => {
      if (event.key === "Enter") {
        login();
      }
    });

    refreshButton.addEventListener("click", loadSubmissions);

    logoutButton.addEventListener("click", () => {
      adminPassword = "";
      submissions = [];
      adminArea.style.display = "none";
      loginArea.style.display = "block";
      passwordInput.value = "";
      submissionList.innerHTML = "";
      summaryText.textContent = "目前共 0 筆資料";
    });

    document.querySelectorAll("#typeFilters .filter-button").forEach(button => {
      button.addEventListener("click", () => {
        document.querySelectorAll("#typeFilters .filter-button").forEach(item => {
          item.classList.remove("selected");
        });

        button.classList.add("selected");
        currentTypeFilter = button.dataset.filter;
        renderSubmissions();
      });
    });

    document.querySelectorAll("#groupFilters .filter-button").forEach(button => {
      button.addEventListener("click", () => {
        document.querySelectorAll("#groupFilters .filter-button").forEach(item => {
          item.classList.remove("selected");
        });

        button.classList.add("selected");
        currentGroupFilter = button.dataset.filter;
        renderSubmissions();
      });
    });

    nameSearch.addEventListener("input", renderSubmissions);
  </script>
</body>
</html>
