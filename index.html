  <!-- ========================================

  <link

    rel="stylesheet"
  >


  <style>

    /* ========================================
       基本
    ======================================== */

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }


    html {
      width: 100%;
      min-height: 100%;
    }


    body {
      width: 100%;
      min-height: 100vh;

      padding: 32px 18px;

      background: #faf8ff;
      color: #4f4660;

      font-family:
        "ChenYuluoyan",
        "HanziPen TC",
        "Hannotate TC",
        "Kaiti TC",
        cursive;
    }


    button,
    input,
    select,
    textarea {
      font: inherit;
    }


    button {
      cursor: pointer;
    }


    h1 {
      position: relative;
      z-index: 10;

      margin-bottom: 28px;

      color: #6b46c1;

      font-size: 27px;
      font-weight: 600;

      line-height: 1.45;

      text-align: center;
    }


    h2 {
      margin-bottom: 22px;

      color: #6b46c1;

      font-size: 25px;
      font-weight: 600;

      text-align: center;
    }


    strong {
      font-weight: 900;
    }


    /* ========================================
       頁面
    ======================================== */

    .page {
      display: none;

      position: relative;
      z-index: 2;

      width: 100%;
      max-width: 620px;

      margin: 0 auto;

      animation: pageIn 0.22s ease;
    }


    .page.active-page {
      display: block;
    }


    @keyframes pageIn {

      from {
        opacity: 0;
        transform: translateY(7px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }

    }


    /* ========================================
       首頁
    ======================================== */

    body.home-mode {
      height: 100vh;
      height: 100dvh;

      overflow: hidden;

      overscroll-behavior: none;
    }


    body.home-mode > h1 {
      color: #ffffff;

      text-shadow:
        0 2px 8px
        rgba(0, 0, 0, 0.35);
    }


    body:not(.home-mode) > h1 {
      color: #6b46c1;
      text-shadow: none;
    }


    #homePage {
      position: relative;
      z-index: 2;
    }


    .home-background {
      position: fixed;
      z-index: -1;

      inset: 0;

      width: 100vw;

      height: 100vh;
      height: 100dvh;

      background-image:
        url("home-banner.JPG");

      background-size: cover;

      background-position:
        center center;

      background-repeat:
        no-repeat;

      pointer-events: none;
    }


    /* ========================================
       ★ 首頁按鈕
       改回你貼的舊版樣式
    ======================================== */

    #homePage .menu-grid {
      position: relative;
      z-index: 5;
    }


    .menu-grid {
      display: grid;

      grid-template-columns:
        repeat(2, minmax(0, 155px));

      justify-content: center;

      gap: 12px;
    }


    .pill-button {
      min-height: 40px;

      padding: 5px 12px;

      background: #ffffff;

      color: #6b46c1;

      border:
        2px solid #d9c8ff;

      border-radius: 999px;

      box-shadow:
        0 4px 12px
        rgba(126, 92, 190, 0.10);

      font-size: 15px;

      line-height: 1.2;

      text-align: center;

      transition: 0.2s ease;
    }


    .pill-button:hover {
      background: #f7f2ff;
    }


    .pill-button:active {
      transform: scale(0.97);
    }


    .pill-button.selected {
      background: #dccfff;

      border-color: #b99bf5;

      color: #59349e;
    }


    /* ========================================
       返回
    ======================================== */

    .back-button {
      display: inline-flex;

      align-items: center;

      margin-bottom: 18px;

      padding: 8px 16px;

      background: #ffffff;

      color: #6b46c1;

      border:
        2px solid #d9c8ff;

      border-radius: 999px;
    }


    .back-button:active {
      transform: scale(0.97);
    }


    /* ========================================
       卡片
    ======================================== */

    .card {
      margin-bottom: 16px;

      padding: 20px;

      background: #ffffff;

      border:
        1px solid #eee6ff;

      border-radius: 22px;

      box-shadow:
        0 6px 18px
        rgba(116, 82, 165, 0.09);
    }


    .card-title {
      margin-bottom: 12px;

      color: #6b46c1;

      font-size: 19px;
      font-weight: 600;
    }


    .card p {
      line-height: 1.8;
    }


    .empty-message {
      padding: 24px;

      color: #8b8295;

      text-align: center;

      line-height: 1.8;
    }


    /* ========================================
       團務分類
    ======================================== */

    .group-type-tabs {
      display: grid;

      grid-template-columns:
        repeat(2, minmax(0, 1fr));

      gap: 10px;

      margin-bottom: 18px;
    }


    .group-type-button {
      width: 100%;

      padding: 9px 14px;

      background: #ffffff;

      color: #6b46c1;

      border:
        1.5px solid #d9c8ff;

      border-radius: 999px;

      font-size: 16px;
      font-weight: 600;
    }


    .group-type-button.selected {
      background: #dccfff;

      border-color: #b99bf5;

      color: #59349e;
    }


    .group-type-content {
      display: none;
    }


    .group-type-content.active {
      display: block;
    }


    /* ========================================
       團務卡
    ======================================== */

    .order-card {
      overflow: hidden;
      padding: 0;
    }


    .order-top {
      padding: 20px;
    }


    .order-group {
      margin-bottom: 7px;

      color: #927ead;

      font-size: 14px;
      font-weight: 600;
    }


    .order-name {
      color: #59349e;

      font-size: 19px;
      font-weight: 600;

      line-height: 1.55;
    }


    .order-status {
      display: inline-flex;

      margin-top: 12px;

      padding: 6px 11px;

      background: #e4f5e8;

      color: #287747;

      border-radius: 999px;

      font-size: 14px;
      font-weight: 600;
    }


    .order-status.closed {
      background: #eeeef2;
      color: #686572;
    }


    .order-action {
      width: 100%;

      padding: 13px;

      background: #f1eaff;

      color: #6842b3;

      border: none;

      border-top:
        1px solid #e5dafb;

      font-weight: 600;
    }


    .order-action.closed,
    .order-action:disabled {
      background: #eeeef2;

      color: #99939f;

      cursor: not-allowed;

      opacity: 1;
    }


    /* ========================================
       匯款入口
    ======================================== */

    .payment-start-help {
      margin-bottom: 16px;

      color: #71657d;

      line-height: 1.75;
    }


    .payment-start-button {
      width: 100%;

      margin-top: 16px;

      padding: 12px 16px;

      background: #cbb8f5;

      color: #4c2e83;

      border: none;

      border-radius: 999px;

      font-size: 17px;

      font-weight: 600;
    }


    .payment-start-button:disabled {
      background: #e8e5ec;

      color: #aaa3b0;

      cursor: not-allowed;
    }


    /* ========================================
       商品團務名稱
    ======================================== */

    .selected-group-card {
      text-align: center;
    }


    .selected-group-label {
      margin-bottom: 5px;

      color: #988ba5;

      font-size: 13px;
    }


    .selected-group-name {
      color: #59349e;

      font-size: 18px;

      font-weight: 600;

      line-height: 1.6;
    }


    /* ========================================
       商品圖鑑
    ======================================== */

    .catalog-note {
      margin-bottom: 13px;

      color: #8b8295;

      font-size: 14px;

      line-height: 1.7;
    }


    .catalog-warning {
      margin-bottom: 14px;

      padding: 10px 12px;

      background: #fff8e8;

      color: #8a6a24;

      border-radius: 13px;

      font-size: 13px;

      line-height: 1.65;
    }


    .catalog-gallery {
      display: grid;

      gap: 10px;
    }


    .catalog-gallery.one-image {
      grid-template-columns: 1fr;
    }


    .catalog-gallery.two-images {
      grid-template-columns:
        repeat(2, minmax(0, 1fr));
    }


    .catalog-gallery.three-images {
      grid-template-columns:
        repeat(3, minmax(0, 1fr));
    }


    .catalog-image-card {
      overflow: hidden;

      background: #faf8ff;

      border:
        1px solid #eee6ff;

      border-radius: 14px;
    }


    .catalog-image {
      display: block;

      width: 100%;

      height: 170px;

      object-fit: cover;

      object-position: top;

      cursor: zoom-in;
    }


    .catalog-gallery.one-image
    .catalog-image {
      height: auto;

      max-height: 430px;

      object-fit: contain;
    }


    .catalog-caption {
      padding: 8px;

      color: #7b6d89;

      font-size: 13px;

      text-align: center;
    }


    /* ========================================
       商品
    ======================================== */

    .product-placeholder {
      padding: 18px;

      color: #8b8295;

      background: #faf8ff;

      border:
        1px dashed #cdb9f6;

      border-radius: 15px;

      text-align: center;
    }


    .product-card {
      margin-bottom: 11px;

      overflow: hidden;

      background: #faf8ff;

      border:
        1px solid #eee6ff;

      border-radius: 16px;
    }


    .product-summary {
      display: flex;

      align-items: center;

      gap: 12px;

      padding: 14px;

      cursor: pointer;

      list-style: none;
    }


    .product-summary::-webkit-details-marker {
      display: none;
    }


    .product-summary::after {
      content: "＋";

      flex-shrink: 0;

      color: #9f7aea;

      font-size: 20px;
    }


    details[open]
    > .product-summary::after {
      content: "－";
    }


    .product-summary-left {
      min-width: 0;

      flex: 1;
    }


    .product-name {
      color: #554b62;

      font-size: 16px;

      font-weight: 600;

      line-height: 1.45;
    }


    .product-hint {
      margin-top: 4px;

      color: #9b8fa7;

      font-size: 12px;
    }


    .product-price {
      flex-shrink: 0;

      color: #6b46c1;

      font-size: 15px;

      font-weight: 600;

      white-space: nowrap;
    }


    .variant-list {
      padding: 0 12px 12px;
    }


    /* ========================================
       商品選項
    ======================================== */

    .product-choice {
      display: grid;

      grid-template-columns:
        minmax(0, 1fr)
        auto;

      align-items: center;

      gap: 10px;

      margin-top: 7px;

      padding: 10px;

      background: #ffffff;

      border:
        1px solid #eee6ff;

      border-radius: 13px;
    }


    .product-choice.selected-choice {
      background: #f7f2ff;

      border-color: #d2bdf9;
    }


    .product-choice.sold-out {
      opacity: 0.48;

      background: #f4f3f6;
    }


    .choice-main {
      display: flex !important;

      align-items: center;

      gap: 8px;

      min-width: 0;

      margin: 0 !important;

      color: #594d68 !important;

      font-size: 14px !important;

      font-weight: 400 !important;

      cursor: pointer;
    }


    .choice-main input {
      width: 18px;
      height: 18px;

      flex-shrink: 0;

      padding: 0;

      accent-color: #9f7aea;
    }


    .stock-text {
      display: block;

      margin-top: 3px;

      color: #9b8fa7;

      font-size: 12px;
    }


    .stock-low {
      color: #b86421;
    }


    .stock-out {
      color: #b34545;

      font-weight: 600;
    }


    /* ========================================
       數量
    ======================================== */

    .quantity-control {
      display: flex;

      align-items: center;

      flex-shrink: 0;

      gap: 4px;
    }


    .qty-button {
      width: 28px;
      height: 28px;

      padding: 0;

      background: #f1eaff;

      color: #6842b3;

      border:
        1px solid #d9c8ff;

      border-radius: 50%;

      font-size: 17px;
    }


    .qty-button:disabled {
      opacity: 0.3;

      cursor: default;
    }


    .qty-input {
      width: 38px;

      height: 30px;

      padding: 2px;

      background: #ffffff;

      border:
        1px solid #e5daf8;

      border-radius: 9px;

      color: #554b62;

      font-size: 14px;

      text-align: center;
    }


    .selected-summary {
      margin-top: 12px;

      color: #8b8295;

      font-size: 14px;

      text-align: right;
    }


    .total-box {
      display: flex;

      align-items: center;

      justify-content: space-between;

      margin-top: 14px;

      padding: 14px 16px;

      background: #eee6ff;

      border-radius: 16px;

      color: #59349e;

      font-weight: 600;
    }


    /* ========================================
       注意事項同意
    ======================================== */

    .agreement-row {
      display: flex;

      align-items: center;

      gap: 10px;
    }


    .agreement-row input {
      width: 20px;
      height: 20px;

      accent-color: #9f7aea;
    }


    .agreement-row label {
      color: #594d68;

      font-size: 17px;

      font-weight: 600;
    }


    .view-notice-button,
    .next-button {
      width: 100%;

      margin-top: 14px;

      padding: 11px 16px;

      border-radius: 999px;
    }


    .view-notice-button {
      background: #ffffff;

      color: #6b46c1;

      border:
        1.5px solid #d9c8ff;
    }


    .agreement-help {
      margin-top: 10px;

      color: #958a9f;

      font-size: 13px;

      text-align: center;
    }


    .next-button {
      background: #cbb8f5;

      color: #4c2e83;

      border: none;
    }


    .next-button:disabled {
      background: #e8e5ec;

      color: #aaa3b0;

      cursor: not-allowed;
    }


    /* ========================================
       注意事項
    ======================================== */

    .notice-list {
      padding-left: 22px;

      line-height: 1.9;
    }


    .notice-community-link {
      display: inline-flex;

      align-items: center;

      justify-content: center;

      margin-top: 10px;

      padding: 9px 16px;

      background: #f1eaff;

      color: #6842b3;

      border:
        1.5px solid #d9c8ff;

      border-radius: 999px;

      font-weight: 600;

      text-decoration: none;
    }


    .notice-image {
      display: block;

      width: 100%;

      height: auto;

      margin-top: 16px;

      border-radius: 16px;
    }


    /* ========================================
       Checkout
    ======================================== */

    .checkout-summary {
      padding: 14px;

      background: #faf8ff;

      border:
        1px solid #eee6ff;

      border-radius: 15px;
    }


    .checkout-group {
      margin-bottom: 10px;

      color: #
